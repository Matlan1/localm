# Cloudflare Worker config for the localm proxy (report + issues + update). See README.md.
name = "localm-bugreport-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Rate limiting (GA `ratelimit` binding): throttle bug-report ISSUE CREATION per client
# IP so the public, zero-config endpoint cannot be used to spam the repo. Enforced in
# worker.js (fileReport calls env.RATE_LIMIT.limit). Takes effect only when DEPLOYED
# (not in `wrangler dev`). `period` must be 10 or 60 (seconds); `namespace_id` is any
# unique-per-account integer. 20 reports / 60s per IP clears any real human use while
# still capping a hammering script (the window is bursty, so effective allowance is
# ~2-3x). Define it HERE (not the dashboard) so `wrangler deploy` keeps it in sync.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "400"
simple = { limit = 20, period = 60 }

# Workers Logs: captures per-request metadata (status, colo, errors) for up to 7
# days, queryable from the dashboard or the Observability API. Off by default -
# without this, a failed/blocked client request leaves literally no trace to
# debug from, even though the Worker ran fine otherwise.
[observability]
enabled = true

# Public, non-secret config. Point this at the repo issues + releases live in.
[vars]
TARGET_REPO = "Matlan1/localm"
# Optional: comma-separated labels that ALREADY EXIST on the repo. Leave unset to
# file issues with no labels - GitHub rejects an issue that names a missing label.
# ISSUE_LABELS = "bug"

# Secrets are NOT stored in this file. Set them once with wrangler (encrypted):
#   wrangler secret put GITHUB_TOKEN          # PAT: Issues = Read and write (report + issues list)
#   wrangler secret put SHARED_SECRET         # required for the update routes (gate)
#   wrangler secret put UPDATE_GITHUB_TOKEN   # SEPARATE PAT: Contents = Read only (releases/builds)
# The issue token cannot read code; the update token cannot write. SHARED_SECRET is
# REQUIRED once you enable updates (the update routes serve private builds).
