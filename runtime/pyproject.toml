# localm-llama-runtime - the native llama.cpp inference binaries, packaged as a
# wheel so localm carries its own runtime inside its venv instead of depending
# on an external folder on disk.
#
# The binaries themselves (llama.dll + ggml-*.dll + the matched ROCm runtime, or
# the .so/.dylib equivalents) are NOT committed - they are large, platform- and
# GPU-specific, and license-encumbered. Populate localm_llama_runtime/lib/ with
# `localm setup-llama` (downloads a prebuilt) or `--from <build-dir>`.
#
# Install editable so dropping new binaries into lib/ needs no rebuild:
#   uv pip install -e ./runtime
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localm-llama-runtime"
version = "0.1.0"
description = "Native llama.cpp inference binaries for localm (provisioned locally, not committed)"
# The Python packaging shim here is part of localm and shares its license. The
# native binaries downloaded into lib/ at runtime keep their own upstream
# licenses (llama.cpp and ggml are MIT) and are not redistributed via this repo.
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["localm_llama_runtime"]

# Ship whatever binaries have been placed in lib/ when a real wheel is built.
[tool.hatch.build.targets.wheel.force-include]
"localm_llama_runtime/lib" = "localm_llama_runtime/lib"
