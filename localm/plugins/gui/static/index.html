<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localm</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/vendor/github-dark.min.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div id="logo">local<span>m</span></div>
    <nav>
      <button id="nav-chat" class="active">&#128172; Chat</button>
      <button id="nav-coder">&#9881;&#65039; Coder</button>
    </nav>

    <div id="conversations">
      <h3>Conversations <button id="new-conv" title="New conversation">+</button></h3>
      <div id="conv-list"></div>
    </div>

    <div id="model-box">
      <label for="model-select">Model</label>
      <select id="model-select"></select>
      <div id="model-status"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></div>
    </div>
  </aside>

  <main id="main">

    <!-- ============ CHAT ============ -->
    <section id="view-chat" class="view active">
      <div id="chat-messages">
        <div class="empty-hint" id="chat-empty">
          <div class="big">local<span style="color:var(--accent)">m</span></div>
          Chat with your local model. Everything stays on this machine.
        </div>
      </div>
      <div class="composer-wrap">
        <div id="params">
          <div><label>Temperature</label><input id="p-temperature" type="number" step="0.05" min="0" max="2" placeholder="default"></div>
          <div><label>Top-p</label><input id="p-top-p" type="number" step="0.05" min="0" max="1" placeholder="default"></div>
          <div><label>Max tokens</label><input id="p-max-tokens" type="number" step="64" min="1" placeholder="default"></div>
          <div><label>Seed</label><input id="p-seed" type="number" step="1" placeholder="random"></div>
          <div class="full"><label>System prompt</label><textarea id="p-system" rows="3" placeholder="You are a helpful assistant."></textarea></div>
        </div>
        <div class="composer">
          <textarea id="chat-input" rows="1" placeholder="Message the model…  (Ctrl+Enter to send)"></textarea>
          <button class="send" id="chat-send" title="Send">&#10148;</button>
        </div>
        <div class="composer-row">
          <button id="toggle-params">&#9881; parameters</button>
          <span id="chat-usage"></span>
        </div>
      </div>
    </section>

    <!-- ============ CODER ============ -->
    <section id="view-coder" class="view">
      <div id="coder-bar">
        <span class="dot ok"></span>
        <span class="cwd" id="coder-cwd"></span>
        <span id="coder-state"></span>
        <span class="spacer"></span>
        <button class="btn-quiet" id="coder-stop">Stop</button>
        <button class="btn-quiet" id="coder-end">End session</button>
      </div>

      <div id="coder-setup">
        <h2>Coder session</h2>
        <div class="sub">Run the localcoder agent against a project directory. The agent
        can read, write, and run code; destructive actions ask for your approval below
        unless you enable auto-approve.</div>
        <label for="setup-cwd">Project directory</label>
        <input type="text" id="setup-cwd" placeholder="D:\projects\myapp" spellcheck="false">
        <label for="setup-mode">Session persistence</label>
        <select id="setup-mode">
          <option value="privacy" selected>privacy — nothing saved</option>
          <option value="log">log — JSONL audit trail</option>
          <option value="full">full — audit trail + markdown transcript</option>
        </select>
        <div class="checks">
          <label><input type="checkbox" id="setup-auto"> Auto-approve destructive tools</label>
        </div>
        <div class="actions">
          <button class="btn-primary" id="setup-start">Start session</button>
        </div>
      </div>

      <div id="coder-feed" style="display:none"></div>

      <div class="composer-wrap" id="coder-composer" style="display:none">
        <div class="composer">
          <textarea id="coder-input" rows="1" placeholder="Describe a task for the agent…  (Ctrl+Enter to send)"></textarea>
          <button class="send" id="coder-send" title="Send">&#10148;</button>
        </div>
        <div class="composer-row">
          <span></span>
          <span id="coder-usage"></span>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
