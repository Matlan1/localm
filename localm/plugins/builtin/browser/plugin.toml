[plugin]
name = "browser"
version = "1.0.0"
description = "An automated web browser the model can drive, with a live view of the page."
scope = "browser"
register = "plug"
requires_extras = ["browser"]

[surface]
tab_id = "browser"
label = "Browser"
icon = "web"
group = "coder"
assets_dir = "static"
client_entry = "browser.js"
