[plugin]
name = "jobs"
version = "1.0.0"
description = "Scheduled recurring tasks: run a chat or coder prompt on an interval or cron schedule."
scope = "jobs"
register = "plug"
cli = "localm.plugins.builtin.jobs.cli:main"
data_subdir = "jobs"
# The memory-synthesis job calls chat's synthesize_memory (see runner.py), so
# declare the dependency honestly; chat is protected + preinstalled, so this
# never actually blocks an enable (LM-DA-005).
requires = ["chat"]

[surface]
tab_id = "jobs"
label = "Jobs"
icon = "clock"
group = ""
assets_dir = "static"
client_entry = "jobs.js"
