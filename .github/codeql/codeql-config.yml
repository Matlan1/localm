name: "localm CodeQL config"

# Sources: the default remote threat model plus local file, stdin and database
# reads. Command-line arguments and environment variables are not sources.
threat-models:
  - local
  - "!environment"
  - "!commandargs"

# Path-injection barriers for localm's own state files and the plugin-id check
# are declared in the model pack under .github/codeql/extensions/, which code
# scanning loads automatically.

paths-ignore:
  # Test harnesses only.
  - tests
  - tests-js
  - tests-e2e
