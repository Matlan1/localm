version: 2
updates:
  # "uv" (not "pip"): native support for pyproject.toml + uv.lock together, GA since
  # 2025-03. The generic "pip" ecosystem only bumps pyproject.toml's version pin and
  # never touches uv.lock, so every PR failed CI's `uv lock --check` step (the
  # lockfile was always left stale) - #430/#431/#432/#433/#434 all hit this.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive as one pull request; major updates and the
    # packages under exclude-patterns keep a pull request each.
    groups:
      uv-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "av"
          - "certifi"
          - "click"
          - "cryptography"
          - "fastapi"
          - "httpx"
          - "huggingface-hub"
          - "playwright"
          - "psutil"
          - "pydantic"
          - "pytest"
          - "pytest-xdist"
          - "pywin32"
          - "regex"
          - "requests"
          - "rich"
          - "starlette"
          - "tokenizers"
          - "transformers"
          - "triton-windows"
          - "uvicorn"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # GPU/ROCm wheels resolve from a custom AMD index (pyproject [tool.uv.sources]
      # / [[tool.uv.index]]); blanket bumps break the install. Update these by hand
      # against the AMD index.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "rocm"
      - dependency-name: "rocm-sdk-core"
      - dependency-name: "rocm-sdk-libraries-gfx103x-all"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The jsdom/eslint/playwright harness that tests the vanilla-JS GUI. It is a
  # devDependencies-only tree and ships to nobody, so these bumps carry no
  # runtime risk, but they are the only npm surface in the repository and were
  # previously tracked by nothing.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
