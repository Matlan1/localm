version: 2
updates:
  # "uv" (not "pip"): native support for pyproject.toml + uv.lock together, GA since
  # 2025-03. The generic "pip" ecosystem only bumps pyproject.toml's version pin and
  # never touches uv.lock, so every PR failed CI's `uv lock --check` step (the
  # lockfile was always left stale) - #430/#431/#432/#433/#434 all hit this.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # GPU/ROCm wheels resolve from a custom AMD index (pyproject [tool.uv.sources]
      # / [[tool.uv.index]]); blanket bumps break the install. Update these by hand
      # against the AMD index.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "rocm"
      - dependency-name: "rocm-sdk-core"
      - dependency-name: "rocm-sdk-libraries-gfx103x-all"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # checkout, setup-python, setup-uv and setup-node are pinned to full-length
      # commit SHAs (see the workflow files). github/codeql-action alone stays on
      # its floating major tag (v4), which for CodeQL is what upstream recommends:
      # a pinned patch version silently loses functionality as server-side feature
      # flags are retired, and this repo runs the advanced setup that guidance is
      # aimed at. The v4 tag already tracks the latest v4.x, so a patch pin is pure
      # churn (13 v4.x releases in 90 days) and goes stale on arrival - #966 proposed
      # v4.37.4 while v4 already resolved to v4.37.6. Major bumps (v4 to v5) still
      # open a PR, which is the signal worth having. Both minor and patch are listed
      # so the rule holds however dependabot classifies a bare "4" to "4.37.x"
      # transition.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
