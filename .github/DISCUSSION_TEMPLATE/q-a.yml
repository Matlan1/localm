body:
  - type: markdown
    attributes:
      value: |
        Ask anything about localm. Only the first box is required.
        For GPU setup, [docs/gpu-setup.md](https://github.com/Matlan1/localm/blob/master/docs/gpu-setup.md)
        has the backend table, and filling in the other boxes helps us answer.
  - type: textarea
    id: details
    attributes:
      label: Your question
      description: What you want to do, or what happened. One line is enough.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and OS
      placeholder: e.g. AMD RX 6600, Windows 11
  - type: dropdown
    id: backend
    attributes:
      label: Backend you tried
      options:
        - vulkan
        - amd-rocm
        - hip
        - cuda
        - sycl
        - cpu
        - not sure / auto-detected
  - type: textarea
    id: doctor
    attributes:
      label: "`localm doctor` output"
      description: Run `localm doctor` and paste the output.
      render: text
