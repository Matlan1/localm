name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Results are uploaded to code scanning
# as SARIF and published to the OpenSSF API (publish_results), which is what
# backs the Scorecard badge.
#
# With publish_results on, the scorecard-action webapp rejects a workflow that
# declares top-level env or defaults, or that uses actions other than checkout,
# upload-artifact, upload-sarif and the scorecard action itself. Keep this file
# to those.

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 5 * * 3"
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: error

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
