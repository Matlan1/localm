name: CI

on:
  # WHAT TRIGGERS THIS FILE
  #
  #   pull_request   the lint + hygiene + tests matrix runs ONLY when the PR
  #                  carries the `full-ci` label. Every other PR skips it.
  #                  `labeled` is in the types list so adding the label to an
  #                  OPEN PR starts the run without needing a new push.
  #   push           paths-scoped to the two native-binding files below, and it
  #                  runs abi-check ONLY. It never starts the test matrix.
  #   workflow_dispatch / schedule   run the matrix unconditionally.
  #
  # THE LABEL GATE IS THE WHOLE MECHANISM. Do not remove the `full-ci`
  # condition on the test job and do not widen the push paths filter; either
  # one puts the two-platform matrix in front of every change. A RELEASE gets
  # the full suite, so a release PR carries the label - that replaces the old
  # add-the-trigger-then-remove-it dance, which twice left it switched on for
  # every PR.
  #
  # READ THE JOB CONCLUSIONS, NOT THE RUN CONCLUSION. The steps run in order
  # and stop at the first failure, so a red Tests step silently skips the
  # coverage floors, the jsdom GUI tests and ruff.
  #
  # WHAT A LOCAL RUN CANNOT SEE, which is what this matrix is for:
  #   PLATFORM       contributors run Windows; this runs Windows AND Linux.
  #   DEPENDENCY SET this job installs `.[dev,rag]`, which has no numpy; a dev
  #                  venv usually does, so a failure needing numpy ABSENT
  #                  cannot appear locally.
  #   DEPENDENCY VER CI resolves the newest allowed dev tool; a venv lags.
  #
  # WSL reproduces the PLATFORM axis at no cost. It is Ubuntu 26.04 with
  # python3 3.14; localm provisions its own 3.12 via setup.sh, so the host
  # version is not a prerequisite and not a variable in a localm result.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    # NARROW, DELIBERATE EXCEPTION to the no-automatic-CI policy above,
    # decided 2026-08-19: schedule (weekly) + a paths filter on
    # localm/inference/backends/llamacpp/** and localm/setup_llama.py +
    # workflow_dispatch. NOT on every push.
    #
    # The weekly cron below is otherwise the only automatic path to the
    # ABI-drift check, and it is measured to actually fire on its target
    # window only about 1 time in 6 (see the schedule comment). A push that
    # touches the native llama.cpp binding directly is exactly the change
    # most likely to break it, so it gets its own trigger instead of waiting
    # on an unreliable cron.
    #
    # Scoped to trigger ONLY the abi-check job below (see its `if:`), not the
    # full lint+hygiene+tests matrix - that stays manual/scheduled per the
    # policy above, so this does not reintroduce the push-run cost the top
    # comment describes. Exactly these two paths; nothing else in the repo
    # triggers a run through this block.
    paths:
      - "localm/inference/backends/llamacpp/**"
      - "localm/setup_llama.py"
  workflow_dispatch:
    inputs:
      run_abi:
        # OFF by default so a plain dispatch runs EXACTLY the job set a push runs.
        # Before this input, dispatch was the only pre-merge signal (no
        # pull_request trigger) AND it ran a job push skips, so every pre-merge
        # check was a strict SUPERSET of the post-merge run it was predicting.
        # Since abi-check tracks a MOVING upstream target it flips independently
        # of any branch - measured failing and succeeding on the same commit
        # hours apart - so it reported run-level "failure" on healthy branches
        # and every lane carried a "read the job conclusions, not the run
        # conclusion" workaround. This makes the run-level conclusion mean
        # something again; pass -f run_abi=true to opt in.
        description: "Also run the native llama.cpp ABI drift check (slow; tracks a MOVING upstream target)"
        type: boolean
        default: false
  schedule:
    # Weekly drift check of the hand-written llama.cpp ctypes binding against the
    # MOVING upstream release the cpu/vulkan/cuda backends track.
    #
    # Moved OFF the top of the hour, which is not cosmetic. Measured: this cron
    # has been present since 2026-06-21 and the workflow state is `active` (not
    # disabled manually, not disabled for inactivity), yet exactly ONE
    # schedule-event run exists in the entire history (2026-07-06). Five of the
    # six eligible Mondays never fired at all - so the ABI drift job has had
    # essentially no automatic coverage for its whole life.
    #
    # GitHub queues scheduled workflows globally and drops or delays them under
    # load; :00 is the single most contended minute of the hour, because it is
    # what everyone writes. An odd off-peak minute is the standard mitigation and
    # costs nothing. This is a MITIGATION, not a proven fix: if schedule runs are
    # still missing several Mondays from now, the cron is not the cause and the
    # next suspect is repository-level scheduling being throttled - check
    # `gh run list --workflow=CI` filtered to event=schedule before assuming.
    #
    # This matters more since the run_abi input landed: a plain dispatch no longer
    # runs abi-check. Since 2026-08-19 the narrow push trigger above covers a
    # touch to the two llamacpp/setup_llama.py paths; this cron remains the
    # only automatic path for everything else that could drift (an upstream
    # release moving under an unrelated commit, for instance).
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    # INFRA-1: run on Linux as well as Windows. Both are declared supported
    # platforms (see the classifiers in pyproject.toml), so cross-platform
    # regressions (paths, line endings, signals, the SetConsoleCtrlHandler path,
    # process spawning) must be caught here, not by a user on the other OS.
    name: lint + hygiene + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Never on the abi-drift push trigger (that runs abi-check only), and on a
    # pull_request only when the PR carries the `full-ci` label. Unconditional
    # for workflow_dispatch and schedule.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      # Do not cancel the other OS on the first failure: a Linux-only break is
      # exactly the signal this matrix exists to surface, so let Windows finish.
      fail-fast: false
      matrix:
        # Pinned off the floating ubuntu-latest label (currently ubuntu-24.04,
        # image 20260823.283.1). (#1577)
        os: [windows-latest, ubuntu-22.04]
    steps:
      # fetch-depth: 0 (full history) is REQUIRED, not a nicety: the hygiene gates that
      # diff against the published record - the changelog append-only check and the PWA
      # cache-bump check - resolve their baseline via `git merge-base HEAD origin/master`.
      # actions/checkout defaults to fetch-depth 1, which creates no origin/* ref at all,
      # so merge-base fails, the baseline silently falls back to HEAD, and a clean CI
      # checkout diffs against ITSELF: both gates then pass unconditionally, for every
      # file, on every PR. Measured on real repos: shallow -> a shell asset changed with
      # no CACHE bump exits 0 (silent pass); full -> the same commit correctly fails.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # DEP-1: the committed uv.lock must stay consistent with pyproject.toml so a
      # dependency change without a matching `uv lock` cannot silently rot the lock
      # into a stale claim. `uv lock --check` fails on drift. (The Install step
      # below still uses pip; the lock is the pinned set for `uv sync --locked`.)
      - name: Install uv (for the lockfile check)
        uses: astral-sh/setup-uv@v7
      - name: Verify uv.lock matches pyproject (DEP-1, no silent drift)
        run: uv lock --check

      # localm is meant to run from its PROJECT VENV: a venv guard (NEW-J) refuses
      # a bare global interpreter so a stray global install fails loudly instead of
      # with a cryptic missing-runtime-dep error. Create a venv and prepend it to
      # PATH so every step below - pip, pytest, ruff, hygiene, AND the
      # `python -m localm` SUBPROCESSES the job-streaming tests spawn - runs from
      # it, matching real usage. Per-OS steps use each runner's NATIVE shell +
      # $GITHUB_WORKSPACE (a native path on both); a single Git-Bash step would put
      # an MSYS path like /d/a/... on PATH that the Windows steps cannot resolve.
      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH (POSIX)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Put the venv on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.venv\Scripts"

      # Light extras only ([rag] = pypdf, pure-Python). The [gpu]/[gguf] extras
      # pull torch / ROCm / llama-cpp wheels from a custom AMD index and are
      # GPU-bound, so they are never installed in CI; tests needing those extras
      # skip themselves (importorskip).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      # The mandated repo-hygiene gate (AGENTS.md): no em/en dashes, no personal
      # disclosure, no machine-absolute paths in code. It also runs the release-file
      # manifest gate (scripts/check_manifest.py, folded into check_hygiene): every
      # tracked file must be classified release-include/-exclude in release-manifest.toml,
      # nothing local-only may be committed, and no pattern may go stale.
      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      # TEST-1: measure coverage and enforce the ratchet. pyproject.toml
      # [tool.coverage.report] sets fail_under=78 (one point below the 79%
      # measured 2026-07-29), and pytest-cov reads that automatically - this
      # step now fails the build on a real drop, not just prints a number.
      # --cov-report=json additionally feeds the per-module trust-boundary
      # floors below (coverage.py has no per-file fail_under of its own). The
      # [gpu]/[gguf] extras are not installed, so tests that need them
      # importorskip and are simply not counted.
      # -n auto (pytest-xdist) distributes across worker processes; every test
      # already gets its own LOCALM_HOME via the autouse tmp_path fixture in
      # tests/conftest.py and the few tests that bind a real socket use an
      # OS-assigned ephemeral port, so this is safe. See AGENTS.md "Test-run
      # cadence".
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -m "not integration" -n auto --cov=localm --cov-report=term-missing --cov-report=xml --cov-report=json

      # TEMPORARY DIAGNOSTIC: interleaves a report-log tail (which test's
      # setup phase has completed with no call/teardown yet - i.e. likely
      # in-flight per worker) into this same live step log, so it survives
      # a runner-level kill that a completion-time report never would.
      - name: Tests (Linux, diagnostic)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pip install pytest-reportlog
          (
            pytest -m "not integration" -n auto --cov=localm --cov-report=term-missing --cov-report=xml --cov-report=json --report-log=/tmp/pytest-report.jsonl
          ) &
          PYTEST_PID=$!
          while kill -0 "$PYTEST_PID" 2>/dev/null; do
            sleep 15
            echo "=== DIAG $(date -u +%H:%M:%S) ==="
            free -h | head -3
            echo "procs: $(ps -e --no-headers | wc -l) threads: $(ps -eL --no-headers | wc -l)"
            ps -e -o comm= | sort | uniq -c | sort -rn | head -6
            if [ -f /tmp/pytest-report.jsonl ]; then
              jq -s '[.[] | select(.["$report_type"]=="TestReport")] as $r | ($r | map(select(.when=="setup") | .nodeid)) as $setups | ($r | map(select(.when=="call" or .when=="teardown") | .nodeid)) as $done | {inflight: ($setups - $done)[-12:], total_setups: ($setups|length)}' /tmp/pytest-report.jsonl || echo "jq parse pending"
            fi
          done
          wait "$PYTEST_PID"

      # Per-module coverage floors for the trust boundary (pathsafe, auth,
      # netpolicy, scopes, tls, bindhost, config, portmux): a missed branch in
      # these is a potential vulnerability, not a cosmetic gap, so each has its
      # own floor the global 78% ratchet above could otherwise hide entirely
      # (the rest of the repo gaining coverage would mask one of these
      # quietly regressing). See scripts/check_coverage_floors.py for the
      # floors themselves and why they are a script rather than a coverage.py
      # plugin (coverage.py has no native per-file fail_under).
      #
      # windows-latest ONLY, deliberately: several of these modules branch on
      # the REAL host OS, not on test input - pathsafe.py's UNC/device-path
      # rejection only takes its raise arc when os.name == "nt" (the tests
      # assert the opposite behavior on POSIX rather than monkeypatching
      # os.name to force it), and config.py's file-permission/atomic-replace
      # retry logic branches the same way. So a small file's measured
      # percentage is not one number, it is one number PER PLATFORM - gating
      # both matrix legs against a single baseline would misattribute that
      # structural split as a regression the first time this ran on Linux.
      # These floors were measured and verified (both pass and fail) on
      # Windows only; re-derive and verify a second set before ever gating
      # the ubuntu-latest leg too.
      # --report prints each module's REAL measured percent next to its floor
      # before enforcing (it does not suppress the check - see the script). That
      # makes every CI run publish the numbers needed to raise a floor, so the
      # next person does not need a local --cov run to find them. Not a luxury:
      # portmux.py's floor sat ~60 points below its real value because the only
      # way to learn the real value was to re-measure it by hand.
      - name: Per-module coverage floors (trust boundary)
        if: matrix.os == 'windows-latest'
        run: python scripts/check_coverage_floors.py --report

      # coverage.json is computed above and otherwise dies with the runner.
      # always() so the number is still published when Tests failed on the
      # ratchet itself; continue-on-error and the script's own exit code keep
      # this a display step, never a second gate.
      - name: Publish coverage summary
        if: always()
        continue-on-error: true
        run: python scripts/write_coverage_summary.py

      # GUI is vanilla JS (localm/plugins/gui/static); the jsdom harness under
      # tests-js/ loads app.js and exercises it. node:test, no build step.
      - name: Setup Node (GUI JS tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: GUI tests (jsdom)
        run: |
          npm ci
          npm test

      # ruff is configured (pyproject [tool.ruff]) and blocking: the unused-import
      # backlog (F401/F841/E401/F541) was cleared, so a new lint regression fails CI.
      - name: Lint (ruff)
        run: ruff check .

  # Validate the hand-written ctypes binding against the ACTUAL upstream binary.
  # Heavy (downloads the cpu prebuilt) and checks a MOVING upstream target, so it
  # runs weekly + on manual dispatch only, not on every push. Per-push coverage of
  # the binding lives in the offline unit tests (test_llamacpp_abi.py,
  # test_check_llama_abi.py) on the job above.
  abi-check:
    name: native llama.cpp ABI drift
    runs-on: windows-latest
    # The weekly cron still runs it unconditionally; a dispatch must opt in.
    # `inputs.run_abi` is undefined (falsy) for push and schedule events, so
    # the schedule arm and the push arm are what keep the drift coverage
    # outside a manual dispatch. The push arm fires only for the narrow,
    # paths-scoped push trigger above (llamacpp backend + setup_llama.py) -
    # GitHub Actions has already filtered the run to those paths before this
    # condition is even evaluated.
    if: github.event_name == 'schedule' || inputs.run_abi || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      # Header-level drift: diff our struct offsets against the latest upstream
      # llama.h. A mid-struct reorder/insert exits non-zero here.
      - name: Header ABI diff vs latest upstream release
        shell: bash
        run: python scripts/check_llama_abi.py --ref latest

      # Binary-level drift: provision the real cpu prebuilt (GPU-free, loads on a
      # plain runner). setup-llama load-tests it, which runs verify_abi; the
      # explicit report below fails the job on a proven mismatch.
      - name: Provision cpu prebuilt and verify ABI against the real binary
        shell: bash
        run: |
          python -m localm setup-llama --backend cpu --yes
          python - <<'PY'
          import sys
          from localm.inference.backends.llamacpp._abi import abi_report
          v = abi_report()
          print("ABI status:", v.status, "| detail:", v.detail)
          for f in v.failures:
              print("  -", f)
          sys.exit(1 if v.status == "mismatch" else 0)
          PY

      # The step above proves the pinned build LOADS. This one proves it
      # GENERATES, which is a different claim and the one that matters: "it loads
      # so it will be fine" is what shipped a runtime our own gate then refused.
      #
      # WHAT THIS RUNNER CAN HONESTLY CONFIRM, stated so a green tick is not read
      # as more than it is: cpu only. There is no GPU here, so vulkan, cuda, hip,
      # sycl and metal are NOT confirmed by this job and the script says so in
      # its own output rather than quietly passing over them. That is not a token
      # check - the ABI/struct compatibility that actually broke is carried by
      # one shared llama library across every backend of a release, so cpu covers
      # exactly the failure class this exists to catch. What it does not cover is
      # whether another backend's ggml plugin produces tokens on its hardware.
      #
      # ~88 MB model download, and the release CDN drops connections often enough
      # that the script retries. A genuine FAIL exits 1 (the build is bad); "we
      # could not measure" exits 2 and must NEVER read as a pass, which is why
      # the two are branched on separately here rather than by `|| true`.
      - name: Confirm the pinned build loads AND generates (cpu only on a runner)
        shell: bash
        run: |
          set +e
          python scripts/confirm_llama_runtime.py --backend cpu
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::could not measure the pinned build here (see above);"\
                 "this is NOT a confirmation and NOT a failure of the build"
            exit 0
          fi
          exit "$rc"

      # Currency, so the pin cannot rot unnoticed: a pin nobody advances fails a
      # user as surely as tracking latest does, just more slowly. Warn-only and
      # always exit 0, exactly like comfyui-pin-check below - advancing the pin
      # needs someone to run the confirm script against real hardware and read
      # the result, which is a person's decision.
      - name: Report how far the llama.cpp pin has fallen behind upstream
        continue-on-error: true
        run: python scripts/check_llama_pin.py

  # Maintenance signal for a second bundled-and-pinned dependency, same shape as
  # abi-check above but far cheaper: one GitHub API call, no clone, no prebuilt
  # download. Runs on every trigger of this workflow (no run_abi-style opt-in
  # needed) because unlike abi-check it can never fail the build - the script
  # always exits 0 and the step itself is continue-on-error, so a stale pin (or
  # even a bug in the script) never turns CI red. See scripts/check_comfyui_pin.py.
  comfyui-pin-check:
    name: ComfyUI pin currency (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare bundled ComfyUI pin against upstream latest release
        continue-on-error: true
        run: python scripts/check_comfyui_pin.py
