name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check of the hand-written llama.cpp ctypes binding against the
    # MOVING upstream release the cpu/vulkan/cuda backends track. Mon 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    # INFRA-1: run on Linux as well as Windows. Both are declared supported
    # platforms (see the classifiers in pyproject.toml), so cross-platform
    # regressions (paths, line endings, signals, the SetConsoleCtrlHandler path,
    # process spawning) must be caught here, not by a user on the other OS.
    name: lint + hygiene + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other OS on the first failure: a Linux-only break is
      # exactly the signal this matrix exists to surface, so let Windows finish.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Light extras only ([rag] = pypdf, pure-Python). The [gpu]/[gguf] extras
      # pull torch / ROCm / llama-cpp wheels from a custom AMD index and are
      # GPU-bound, so they are never installed in CI; tests needing those extras
      # skip themselves (importorskip).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      # The mandated repo-hygiene gate (AGENTS.md): no em/en dashes, no personal
      # disclosure, no machine-absolute paths in code.
      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      # TEST-1: publish coverage for visibility. There is no --cov-fail-under gate
      # yet (a low number must not fail the build); the goal this pass is a number
      # in the log plus an uploaded coverage.xml. Config is in pyproject
      # [tool.coverage]. The [gpu]/[gguf] extras are not installed, so tests that
      # need them importorskip and are simply not counted.
      - name: Tests
        run: pytest -m "not integration" --cov=localm --cov-report=term-missing --cov-report=xml

      # GUI is vanilla JS (localm/plugins/gui/static); the jsdom harness under
      # tests-js/ loads app.js and exercises it. node:test, no build step.
      - name: Setup Node (GUI JS tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: GUI tests (jsdom)
        run: |
          npm ci
          npm test

      # ruff is configured (pyproject [tool.ruff]) and blocking: the unused-import
      # backlog (F401/F841/E401/F541) was cleared, so a new lint regression fails CI.
      - name: Lint (ruff)
        run: ruff check .

  # Validate the hand-written ctypes binding against the ACTUAL upstream binary.
  # Heavy (downloads the cpu prebuilt) and checks a MOVING upstream target, so it
  # runs weekly + on manual dispatch only, not on every push. Per-push coverage of
  # the binding lives in the offline unit tests (test_llamacpp_abi.py,
  # test_check_llama_abi.py) on the job above.
  abi-check:
    name: native llama.cpp ABI drift
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      # Header-level drift: diff our struct offsets against the latest upstream
      # llama.h. A mid-struct reorder/insert exits non-zero here.
      - name: Header ABI diff vs latest upstream release
        shell: bash
        run: python scripts/check_llama_abi.py --ref latest

      # Binary-level drift: provision the real cpu prebuilt (GPU-free, loads on a
      # plain runner). setup-llama load-tests it, which runs verify_abi; the
      # explicit report below fails the job on a proven mismatch.
      - name: Provision cpu prebuilt and verify ABI against the real binary
        shell: bash
        run: |
          python -m localm setup-llama --backend cpu --yes
          python - <<'PY'
          import sys
          from localm.inference.backends.llamacpp._abi import abi_report
          v = abi_report()
          print("ABI status:", v.status, "| detail:", v.detail)
          for f in v.failures:
              print("  -", f)
          sys.exit(1 if v.status == "mismatch" else 0)
          PY
