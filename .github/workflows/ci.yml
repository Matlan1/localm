name: CI

on:
  # WHAT TRIGGERS THIS FILE
  #
  #   pull_request   the lint + hygiene + tests matrix runs ONLY when the PR
  #                  carries the `full-ci` label. Every other PR skips it.
  #                  `labeled` is in the types list so adding the label to an
  #                  OPEN PR starts the run without needing a new push. The
  #                  mutation-run shards run the same way, gated on the
  #                  `mutation-test` label instead - see that job below.
  #                  mutation-scope runs on every pull_request and only
  #                  NOTICES when the diff touches a [tool.mutmut]
  #                  only_mutate module; it never starts the shards.
  #                  python-pr-gate runs on every pull_request WITHOUT that
  #                  label: lockfile check, hygiene, ruff, and the tests
  #                  scripts/affected_tests.py selects for the diff. A
  #                  labelled PR gets the matrix instead. merge-policy runs
  #                  on every pull_request after those jobs and sums them up
  #                  into one check - see that job below.
  #   push           paths-scoped to the two native-binding files below, and it
  #                  runs abi-check ONLY. It never starts the test matrix.
  #   workflow_dispatch   runs the matrix unconditionally, plus the mutation
  #                  shards (and so the mutation-test gate); never on push.
  #   schedule       two crons. The nightly one ("23 3 * * *") runs test,
  #                  gui-tests, optional-stacks and lint on master. The weekly
  #                  one ("37 6 * * 1") runs those plus every job that is
  #                  weekly only: the mutation shards and gate, abi-check,
  #                  web-search-canary, voice-stack and the two pin checks. A
  #                  weekly-only job tests
  #                  github.event.schedule == '37 6 * * 1'.
  #
  # THE LABEL GATE IS THE WHOLE MECHANISM. Do not remove the `full-ci`
  # condition on the test job and do not widen the push paths filter; either
  # one puts the two-platform matrix in front of every change. A RELEASE gets
  # the full suite, so a release PR carries the label - that replaces the old
  # add-the-trigger-then-remove-it dance, which twice left it switched on for
  # every PR.
  #
  # READ THE JOB CONCLUSIONS, NOT THE RUN CONCLUSION. The steps run in order
  # and stop at the first failure, so a red Tests step silently skips the
  # coverage floors, the jsdom GUI tests and ruff.
  #
  # WHAT A LOCAL RUN CANNOT SEE, which is what this matrix is for:
  #   PLATFORM       contributors run Windows; this runs Windows AND Linux.
  #   DEPENDENCY SET this job installs `.[dev,rag]`, which has no numpy; a dev
  #                  venv usually does, so a failure needing numpy ABSENT
  #                  cannot appear locally.
  #   DEPENDENCY VER CI resolves the newest allowed dev tool; a venv lags.
  #
  # WSL reproduces the PLATFORM axis at no cost. It is Ubuntu 26.04 with
  # python3 3.14; localm provisions its own 3.12 via setup.sh, so the host
  # version is not a prerequisite and not a variable in a localm result.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    # NARROW, DELIBERATE EXCEPTION to the no-automatic-CI policy above,
    # decided 2026-08-19: schedule (weekly) + a paths filter on
    # localm/inference/backends/llamacpp/** and localm/setup_llama/** +
    # workflow_dispatch. NOT on every push.
    #
    # A push that touches the native llama.cpp binding runs the ABI-drift
    # check on that commit instead of at the next weekly schedule run.
    #
    # Scoped to trigger ONLY the abi-check job below (see its `if:`), not the
    # full lint+hygiene+tests matrix - that stays manual/scheduled per the
    # policy above, so this does not reintroduce the push-run cost the top
    # comment describes. Exactly these two paths; nothing else in the repo
    # triggers a run through this block.
    paths:
      - "localm/inference/backends/llamacpp/**"
      - "localm/setup_llama/**"
  workflow_dispatch:
    inputs:
      run_abi:
        # OFF by default so a plain dispatch does not include the flaky
        # abi-check job. This input gates ONLY abi-check - it has no effect
        # on test, gui-tests or mutation-run, which always run on
        # workflow_dispatch regardless (see the top-of-file trigger
        # comment). Before this input existed, dispatch was the only
        # pre-merge signal (no pull_request trigger) and it always ran
        # abi-check alongside the rest of the matrix, even though abi-check
        # tracks a MOVING upstream target and flips independently of any
        # branch - measured failing and succeeding on the same commit hours
        # apart - so it reported run-level "failure" on healthy branches and
        # every lane carried a "read the job conclusions, not the run
        # conclusion" workaround. Gating it here makes the run-level
        # conclusion of the rest of a dispatch mean something again; pass
        # -f run_abi=true to opt in.
        description: "Also run the native llama.cpp ABI drift check (slow; tracks a MOVING upstream target)"
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 06:37 UTC, on master. The jobs it runs include the test
    # matrix, the mutation shards with the mutation-test gate, and the
    # ABI-drift check of the hand-written llama.cpp ctypes binding against
    # the MOVING upstream release the cpu/vulkan/cuda backends track. GitHub
    # can start a scheduled run hours late. Apart from the narrow push
    # trigger above for the ABI-drift check, this is the only automatic run
    # of the ABI-drift check and of the mutation gate. The minute stays off
    # the top of the hour, where GitHub drops scheduled runs under load. (#860)
    - cron: "37 6 * * 1"
    # Nightly, 03:23 UTC, on master: test, gui-tests, optional-stacks and lint.
    - cron: "23 3 * * *"

concurrency:
  # Supersede a run whose commit has already been replaced by a newer push to
  # the same branch. Measured over a recent 200-run window, superseded runs were
  # burning roughly an hour of runner time a day, the worst single case being 19
  # minutes of a 22 minute Ubuntu matrix leg that a newer push had already
  # obsoleted.
  #
  # Each term of the group key is load-bearing:
  #   event_name   a push-triggered abi-check and a pull_request run never share
  #                a group, so they can never cancel one another.
  #   schedule     the nightly and weekly crons never share a group, so a
  #                nightly run never replaces a queued weekly run.
  #   ref          the branch is the unit of supersession.
  #   full-ci      `synchronize` and `labeled` can fire on the SAME commit a
  #                second apart. Without this term the second to arrive would
  #                cancel the first, so an unlabeled run could kill the
  #                two-platform matrix on a release PR. Separating labeled from
  #                unlabeled runs makes that unrepresentable.
  group: ci-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
  # Cancel pull_request runs ONLY. The push leg is the paths-scoped abi-check on
  # a native binding change and must always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The test matrix is split in two. test-shard runs one slice of the suite per
  # (OS, shard) job; test gathers the slices of one OS, checks they cover the
  # suite exactly once, and gates on the COMBINED coverage. tests/_shard.py
  # does the split. Both jobs carry the same condition, so a pull_request
  # without the `full-ci` label runs neither.
  #
  # Each slice runs `-n auto`: xdist starts one worker per physical core. See
  # test_every_shard_runs_xdist_auto.
  test-shard:
    name: tests (${{ matrix.os }}, shard ${{ matrix.shard }}/5)
    runs-on: ${{ matrix.os }}
    # A wedged pytest run makes no progress and never exits, so without this the
    # job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 45
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      # Do not cancel the other OS on the first failure: a Linux-only break is
      # exactly the signal this matrix exists to surface, so let Windows finish.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4, 5]
    env:
      COVERAGE_FILE: shard-out/coverage-${{ matrix.shard }}.dat
    steps:
      # fetch-depth: 0 (full history) is REQUIRED: tests and hygiene gates that
      # diff against the published record resolve their baseline via
      # `git merge-base HEAD origin/master`; a shallow checkout has no origin/*
      # ref, so that diff silently falls back to HEAD and passes unconditionally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # localm refuses a bare global interpreter, so every step below (pip,
      # pytest and the `python -m localm` subprocesses the tests spawn) runs
      # from a project venv on PATH. Each OS uses its native shell for the PATH
      # step: a Git-Bash step would put an MSYS path on the Windows PATH.
      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH (POSIX)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Put the venv on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.venv\Scripts"

      # Light extras only ([rag] = pypdf, pure-Python). The [gpu]/[gguf] extras
      # pull torch / ROCm / llama-cpp wheels and are never installed in CI;
      # tests needing those extras skip themselves (importorskip).
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        shell: bash
        run: |
          uv export --quiet --locked --no-emit-project --extra dev --extra rag -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      # --cov-fail-under=0: the global ratchet and the per-module floors gate the
      # COMBINED data in the test job, not this slice's share of it.
      # Every test already gets its own LOCALM_HOME via the autouse tmp_path
      # fixture in tests/conftest.py and the tests that bind a real socket use
      # an OS-assigned port, so the xdist workers do not collide.
      - name: Create the results directory
        run: mkdir shard-out

      - name: Tests (this shard)
        run: >-
          python -m pytest -p tests._shard
          --shard ${{ matrix.shard }}/5
          --shard-ids-out shard-out/ids-${{ matrix.shard }}.json
          --shard-durations-out shard-out/durations-${{ matrix.shard }}.json
          -m "not integration" -n auto --durations=25 -rs
          --cov=localm --cov-report= --cov-fail-under=0

      - name: Record this shard's result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p shard-out
          echo "$JOB_STATUS" > "shard-out/status-$SHARD.txt"

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shard-${{ matrix.os }}-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  test:
    # INFRA-1: run on Linux as well as Windows. Both are declared supported
    # platforms (see the classifiers in pyproject.toml), so cross-platform
    # regressions (paths, line endings, signals, the SetConsoleCtrlHandler path,
    # process spawning) must be caught here, not by a user on the other OS.
    name: lint + hygiene + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test-shard]
    timeout-minutes: 20
    # Runs after a shard failed so the report still names what ran. See
    # test_the_test_job_cannot_pass_over_a_failed_shard.
    if: >-
      !cancelled() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 for the same reason as in test-shard: the hygiene gates
      # diff against `git merge-base HEAD origin/master`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # DEP-1: the committed uv.lock must stay consistent with pyproject.toml so a
      # dependency change without a matching `uv lock` cannot silently rot the lock
      # into a stale claim. `uv lock --check` fails on drift.
      - name: Install uv (for the lockfile check)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Verify uv.lock matches pyproject (DEP-1, no silent drift)
        run: uv lock --check

      # The mandated repo-hygiene gate: no em/en dashes, no personal
      # disclosure, no machine-absolute paths in code. It also runs the release-file
      # manifest gate (scripts/check_manifest.py, folded into check_hygiene): every
      # tracked file must be classified release-include/-exclude in release-manifest.toml,
      # nothing local-only may be committed, and no pattern may go stale.
      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      - name: Install the coverage tooling
        shell: bash
        run: |
          uv export --quiet --locked --no-emit-project --extra dev -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"

      - name: Download this platform's shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: shard-${{ matrix.os }}-*
          merge-multiple: true
          path: shard-out

      # Fails unless all five shards of this OS reported, each job ended in
      # success, their selections are identical, no test ran in two shards and
      # their union is the whole selection.
      - name: Every test ran in exactly one shard
        run: python -m tests._shard verify shard-out --count 5 --coverage-files

      # TEST-1: the coverage ratchet. pyproject.toml [tool.coverage.report]
      # sets fail_under=78, and `coverage report` reads it, so this step fails
      # the build on a real drop of the combined number.
      - name: Combine coverage
        run: |
          python -m coverage combine shard-out/coverage-*.dat
          python -m coverage json -o coverage.json
      - name: Coverage ratchet (fail_under)
        run: python -m coverage report

      # Per-module coverage floors for the trust boundary (pathsafe, auth,
      # netpolicy, scopes, tls, bindhost, config, portmux): a missed branch in
      # these is a potential vulnerability, not a cosmetic gap, so each has its
      # own floor the global ratchet could otherwise hide. See
      # scripts/check_coverage_floors.py for the floors.
      #
      # windows-latest ONLY: several of these modules branch on the REAL host
      # OS, so a small file's measured percentage is one number PER PLATFORM
      # and the floors were derived on Windows alone.
      # --report prints each module's measured percent next to its floor before
      # enforcing, so every run publishes the numbers needed to raise a floor.
      - name: Per-module coverage floors (trust boundary)
        if: matrix.os == 'windows-latest'
        run: python scripts/check_coverage_floors.py --report

      # coverage.json is computed above and otherwise dies with the runner.
      # always() so the number is still published when a gate above failed;
      # continue-on-error and the script's own exit code keep this a display
      # step, never a second gate.
      - name: Publish coverage summary
        if: always()
        continue-on-error: true
        run: python scripts/write_coverage_summary.py

      # The measured seconds per test, merged: the input for refreshing
      # tests/shard_durations_*.json.
      - name: Merge the measured test durations
        if: always()
        continue-on-error: true
        run: python -m tests._shard merge shard-out --out shard-out/merged-durations.json
      - name: Upload the measured test durations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shard-durations-${{ matrix.os }}
          path: shard-out/merged-durations.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # Separate jobs rather than steps in `test`: a killed job skips every later
  # step, which `if: always()` does not survive. Folding either back into
  # `test` loses its result whenever the Python leg dies.

  # GUI is vanilla JS (localm/plugins/gui/static); the jsdom harness under
  # tests-js/ loads app.js and exercises it. node:test, no build step.
  gui-tests:
    name: GUI tests (jsdom, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The other job that runs a test suite, and jsdom has its own documented
    # hang. It finishes in a couple of minutes, so 20 fails a hang quickly.
    timeout-minutes: 20
    # Same gate as the `test` matrix: on a pull_request only when the PR
    # carries the `full-ci` label, never on push, unconditional for
    # workflow_dispatch and schedule.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: GUI tests (jsdom)
        run: |
          npm ci
          npm test

      # Runs `npm run lint` (eslint.config.mjs) and reports but never fails the
      # job. One host only: matches the ruff job's "result does not vary by
      # host" below. (#1780)
      - name: Lint (eslint, non-blocking)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm run lint

  # ruff is configured (pyproject [tool.ruff]) and blocking: a new lint
  # regression fails CI. One host only; ruff's result does not vary by host.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Cheap and independent of the Python suite: runs on every PR, not only
    # under the `full-ci` label that gates the two-platform test matrix.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        run: |
          uv export --quiet --locked --no-emit-project --extra dev --extra rag -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check .

      # Fails on a type error absent from .github/basedpyright-baseline.json.
      # basedpyright rewrites the baseline when errors were fixed; the diff
      # check fails when that shrink was not committed.
      - name: Type check (basedpyright, baseline ratchet)
        run: |
          basedpyright
          git diff --exit-code -- .github/basedpyright-baseline.json || {
            echo "::error::The baseline lists type errors that no longer occur. Run basedpyright and commit .github/basedpyright-baseline.json."
            exit 1
          }

      # Static analysis of the workflow files themselves. --offline keeps it
      # free of network and of any token. It exits non-zero rather than
      # reporting success when it cannot analyze an input.
      - name: Lint workflows (zizmor)
        run: zizmor --offline .github/workflows/

  # The per-PR Python gate: the only job that runs Python tests on a PR
  # without the `full-ci` label. It runs on every pull_request without that
  # label and not on a labelled one, whose whole suite the `test` matrix
  # runs. One host, no coverage; the tests are the ones
  # scripts/affected_tests.py selects for the diff, not the suite.
  #
  # scripts/run_affected_tests.py turns the selector's exit status into what
  # runs, never runs the whole suite, and never exits 0 for anything it did
  # not run:
  #   0 + paths     pytest runs exactly those files
  #   0 + sentinel  no test file is affected (a docs-only change): no pytest
  #   3             the selection exceeds a quarter of the suite: the selector
  #                 runs again at --depth 0 and that selection runs; one still
  #                 wide at depth 0 runs in full (a hub module most tests
  #                 import); one that is every test file (a conftest.py or
  #                 dependency-lock change), empty or failed at depth 0 fails
  #                 the job, which means the change needs the `full-ci` matrix
  #   anything else the job fails: a crashed selector, an empty selection,
  #                 or a path that is not an existing tests/**/test_*.py
  # The selection, its depth, its reasons and the pytest command line go to
  # the job summary.
  python-pr-gate:
    name: Python PR gate (lock, hygiene, ruff, affected tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      # fetch-depth: 0 is required: the selector diffs from
      # `git merge-base origin/master HEAD` and the hygiene gate's append-only
      # checks resolve the same baseline; a shallow checkout has no
      # origin/master at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (for the lockfile check)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Verify uv.lock matches pyproject (no silent drift)
        run: uv lock --check

      # The project venv on PATH, as in the `test` job: pytest, ruff, the
      # hygiene gate and the `python -m localm` subprocesses some tests spawn
      # all run from it.
      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          uv export --quiet --locked --no-emit-project --extra dev --extra rag -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Affected tests
        run: python scripts/run_affected_tests.py --depth 1

  # Validate the hand-written ctypes binding against the ACTUAL upstream binary.
  # Heavy (downloads the cpu prebuilt) and checks a MOVING upstream target, so it
  # runs weekly + on manual dispatch only, not on every push. Per-push coverage of
  # the binding lives in the offline unit tests (test_llamacpp_abi.py,
  # test_check_llama_abi.py) on the job above.
  abi-check:
    name: native llama.cpp ABI drift
    runs-on: windows-latest
    # The weekly cron still runs it unconditionally and the nightly cron never
    # does; a dispatch must opt in.
    # `inputs.run_abi` is undefined (falsy) for push and schedule events, so
    # the schedule arm and the push arm are what keep the drift coverage
    # outside a manual dispatch. The push arm fires only for the narrow,
    # paths-scoped push trigger above (llamacpp backend + setup_llama/) -
    # GitHub Actions has already filtered the run to those paths before this
    # condition is even evaluated.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '37 6 * * 1') ||
      inputs.run_abi ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        shell: bash
        run: |
          uv export --quiet --locked --no-emit-project --extra monitor -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      # Header-level drift: diff our struct offsets against the latest upstream
      # llama.h. A mid-struct reorder/insert exits non-zero here.
      - name: Header ABI diff vs latest upstream release
        shell: bash
        run: python scripts/check_llama_abi.py --ref latest

      # Binary-level drift: provision the real cpu prebuilt (GPU-free, loads on a
      # plain runner). setup-llama load-tests it, which runs verify_abi; the
      # explicit report below fails the job on a proven mismatch.
      - name: Provision cpu prebuilt and verify ABI against the real binary
        shell: bash
        run: |
          python -m localm setup-llama --backend cpu --yes
          python - <<'PY'
          import sys
          from localm.inference.backends.llamacpp._abi import abi_report
          v = abi_report()
          print("ABI status:", v.status, "| detail:", v.detail)
          for f in v.failures:
              print("  -", f)
          sys.exit(1 if v.status == "mismatch" else 0)
          PY

      # The step above proves the pinned build LOADS. This one proves it
      # GENERATES, which is a different claim and the one that matters: "it loads
      # so it will be fine" is what shipped a runtime our own gate then refused.
      #
      # WHAT THIS RUNNER CAN HONESTLY CONFIRM, stated so a green tick is not read
      # as more than it is: cpu only. There is no GPU here, so vulkan, cuda, hip,
      # sycl and metal are NOT confirmed by this job and the script says so in
      # its own output rather than quietly passing over them. That is not a token
      # check - the ABI/struct compatibility that actually broke is carried by
      # one shared llama library across every backend of a release, so cpu covers
      # exactly the failure class this exists to catch. What it does not cover is
      # whether another backend's ggml plugin produces tokens on its hardware.
      #
      # ~88 MB model download, and the release CDN drops connections often enough
      # that the script retries. A genuine FAIL exits 1 (the build is bad); "we
      # could not measure" exits 2 and must NEVER read as a pass, which is why
      # the two are branched on separately here rather than by `|| true`.
      - name: Confirm the pinned build loads AND generates (cpu only on a runner)
        shell: bash
        run: |
          set +e
          python scripts/confirm_llama_runtime.py --backend cpu
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::could not measure the pinned build here (see above);"\
                 "this is NOT a confirmation and NOT a failure of the build"
            exit 0
          fi
          exit "$rc"

      # Currency, so the pin cannot rot unnoticed: a pin nobody advances fails a
      # user as surely as tracking latest does, just more slowly. Warn-only and
      # always exit 0, exactly like comfyui-pin-check below. Runs even when a
      # step above failed: the three steps above track a MOVING upstream target
      # and fail exactly when drift is large, which is when this report matters
      # most. The gating copy of this check is .github/workflows/pin-currency.yml.
      - name: Report how far the llama.cpp pin has fallen behind upstream
        if: always()
        continue-on-error: true
        run: python scripts/check_llama_pin.py

  # Maintenance signal for a second bundled-and-pinned dependency, same shape as
  # abi-check above but far cheaper: one GitHub API call, no clone, no prebuilt
  # download. Runs on every trigger of this workflow except the nightly
  # schedule (no run_abi-style opt-in needed) because unlike abi-check it can never fail the build - the script
  # always exits 0 and the step itself is continue-on-error, so a stale pin (or
  # even a bug in the script) never turns CI red. See scripts/check_comfyui_pin.py.
  comfyui-pin-check:
    name: ComfyUI pin currency (warn-only)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '37 6 * * 1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare bundled ComfyUI pin against upstream latest release
        continue-on-error: true
        run: python scripts/check_comfyui_pin.py

  # Cheap per-PR NOTICE, never a trigger: does the diff from the merge base
  # touch a [tool.mutmut] only_mutate module, the mutation baseline, or the
  # gate scripts? scripts/mutation_scope.py prints the touched paths and, on
  # a hit, a ::notice annotation: with the `mutation-test` label (the same
  # label clause as mutation-run's `if`) it says the mutation gate runs on
  # this PR, without it that the gate did not run and how to run it. It
  # exits 1 (a red job, never a silent "not touched") when it cannot compute
  # the diff, and merge-policy fails on that. Runs on every pull_request; the
  # shards below never depend on it.
  mutation-scope:
    name: mutation scope (trust-boundary module touched?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      # fetch-depth: 0 is required: the script diffs from
      # `git merge-base origin/master HEAD`, which a shallow checkout cannot
      # resolve.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Did this change touch a mutation-tested module or the gate?
        env:
          MUTATION_TEST_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'mutation-test') }}
        run: python scripts/mutation_scope.py --notice --gate-runs "$MUTATION_TEST_LABEL"

  # Mutation testing (mutmut) for the eight trust-boundary modules
  # scripts/check_coverage_floors.py tracks - see pyproject.toml
  # [tool.mutmut]. ubuntu-latest only, and there is no OS dimension on
  # this job at all, so it structurally cannot run on windows-latest: mutmut
  # has no native Windows support and refuses to run there ("please use the
  # WSL"). Runs on the weekly schedule and on a manual dispatch (both against
  # the ref the workflow runs on, so the weekly run gates master), and on a
  # pull_request only under the `mutation-test` label (same mechanism as
  # `full-ci` above). Never on push, and never automatically on a PR: the
  # auth shard alone takes about an hour, and a PR must not wait on it.
  #
  # ONE SHARD PER MODULE. A mutant that hangs the tests is killed by mutmut's
  # wall-clock timeout, (clean test time + 1) x 15 seconds, and those few
  # mutants dominate the run: measured, timeouts were 5% of the mutants and
  # 82% of the worker time. One job for all eight modules never finished
  # inside its 170 minutes on a 4-vCPU runner (six runs, six timeouts at
  # ~2429/3056 mutants), so each module runs in its own job and the
  # mutation-test job below merges the eight result files and gates on them.
  # `mutmut run "localm.<module>.*"` generates every mutant, tests only the
  # named module's, and writes its outcomes to mutants/localm/<module>.py.meta.
  mutation-run:
    name: mutation run (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '37 6 * * 1') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'mutation-test'))
    strategy:
      # Every module's result is wanted even when one shard fails; the gate
      # below reports the missing one by name.
      fail-fast: false
      matrix:
        # Keep in sync with [tool.mutmut] only_mutate in pyproject.toml
        # (tests/test_check_mutation_floors.py pins the two lists together).
        module: [bindhost, scopes, pathsafe, netpolicy, auth, config, tls, portmux]
    env:
      MUTATION_MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        run: |
          uv export --quiet --locked --no-emit-project --extra dev -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r .github/requirements/mutmut.txt
          pip install --no-deps -e .

      # A per-mutant re-test can cost anywhere from a fraction of a second to
      # several minutes, depending on how many tests map to the mutated
      # function. continue-on-error so a cut-short run still uploads whatever
      # real, partial results exist; the gate below fails on the gap.
      #
      # --max-children 16 on a 4-vCPU runner: a hung mutant SLEEPS until its
      # wall-clock timeout (it holds a lock or waits on a socket), so it costs
      # memory, not CPU - roughly 0.2-0.5 GB each, forked from one parent.
      # mutmut's default of one child per CPU lets four sleeping children
      # idle the whole runner; measured, auth's 212 hanging mutants are 99% of
      # its worker time (267 min at 4 children, ~70 at 16). The timeout
      # multiplier itself stays at mutmut's default of 15: two genuine
      # survivors run 3.4-4.4x slower than clean while still passing, and a
      # smaller multiplier would count them as detected.
      #
      # The run gets a fresh random PYTHONHASHSEED, printed before mutmut
      # starts; `PYTHONHASHSEED=<printed value> python scripts/mutmut_run.py
      # run <mutant id>` replays one mutant with the same seed.
      - name: Mutation test one trust-boundary module
        timeout-minutes: 170
        continue-on-error: true
        run: |-
          PYTHONHASHSEED="$(python -c 'import secrets; print(secrets.randbelow(2**32))')"
          export PYTHONHASHSEED
          echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
          python scripts/mutmut_run.py run --max-children 16 "localm.${MUTATION_MODULE}.*"

      - name: Upload this module's mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-meta-${{ matrix.module }}
          path: mutants/localm/${{ matrix.module }}.py.meta
          if-no-files-found: ignore
          retention-days: 14

  # The mutation GATE, not a report: merges the eight shards above and fails
  # when scripts/check_mutation_floors.py finds a module's mutation score
  # below the floor in scripts/mutation_baseline.json, a mutant recorded as
  # killed that now survives, a mutant (new, or in a function whose source
  # changed) with no disposition, one of the pinned control mutants not
  # killed, or an incomplete run. The proposed baseline it writes is
  # uploaded as an artifact so a changed function's dispositions can be
  # reviewed and committed without a local (Linux-only) mutmut run.
  #
  # This is the one job id downstream policy reads for the mutation result:
  # skipped means the shards did not run on this event, failure means the
  # gate is red.
  mutation-test:
    name: mutation testing (mutmut, ubuntu-latest only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [mutation-run]
    # Runs whenever the shards ran, whatever they concluded: a shard that
    # failed or was cut short is reported here as missing or incomplete
    # results, which is a red gate rather than a silently skipped one.
    if: ${{ !cancelled() && needs.mutation-run.result != 'skipped' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # mutmut itself only for export-cicd-stats, which reads the merged
      # .meta files and the [tool.mutmut] config; no localm install needed.
      - name: Install mutmut
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/mutmut.txt

      - name: Download every module's mutation results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: mutation-meta-*
          merge-multiple: true
          path: mutants/localm

      - name: Export mutation stats
        continue-on-error: true
        run: mutmut export-cicd-stats

      - name: Publish mutation summary
        continue-on-error: true
        run: python scripts/write_mutation_summary.py

      # GATE 1 - completeness: fails if mutants were generated but none
      # reached a real outcome (`mutmut run` exits 0 even then, e.g. when a
      # shard's own clean test run failed). Says nothing about the score.
      - name: Verify the run actually completed
        run: python scripts/write_mutation_summary.py --check

      # GATE 2 - the ratchet: per-module score floors, per-mutant
      # dispositions and the pinned control mutants, checked against the
      # COMMITTED scripts/mutation_baseline.json (--out keeps the proposal it
      # also writes out of the check; the step after uploads it). always(),
      # so an incomplete run is still checked (and fails) rather than
      # silently skipping the ratchet.
      - name: Mutation floors and dispositions (trust boundary)
        if: always()
        run: >-
          python scripts/check_mutation_floors.py
          --update --out mutants/mutation_baseline.proposed.json

      # The proposed baseline (current outcomes, floors ratcheted up,
      # equivalent classifications kept) for review when the gate above
      # fails on a changed function: download, classify every new survivor,
      # commit it as scripts/mutation_baseline.json.
      - name: Upload the proposed mutation baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-baseline-proposed
          path: mutants/mutation_baseline.proposed.json
          if-no-files-found: ignore
          retention-days: 14

  # Maintenance signal for a third bundled-and-pinned dependency, same shape as
  # comfyui-pin-check above: one GitHub API call, no clone, no prebuilt
  # download. Runs on every trigger of this workflow except the nightly
  # schedule, and can never fail the build - the script always exits 0
  # and the step itself is continue-on-error. See scripts/check_llama_rocm_pin.py.
  llama-rocm-pin-check:
    name: llama.cpp ROCm pin currency (warn-only)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '37 6 * * 1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare bundled lemonade-sdk ROCm build pin against upstream latest release
        continue-on-error: true
        run: python scripts/check_llama_rocm_pin.py

  # Live canary for the web-search retrieval pipeline (ADR-0022 Phase 5, item
  # 25). Every OTHER test of localm.web_retrieval runs against a recorded
  # fixture double on purpose - offline PR CI must never depend on the
  # internet - so nothing else here ever makes a real call to DuckDuckGo, Brave
  # Search or a configured SearXNG instance. A markup change or a datacenter-IP
  # rate limit would otherwise go unnoticed until a user hit it.
  #
  # UNLIKE comfyui-pin-check/llama-rocm-pin-check above, this job is NOT left
  # to run on every trigger: `if:` restricts it to `schedule` and
  # `workflow_dispatch` ONLY, so it structurally cannot run on `pull_request`
  # or the paths-scoped `push` above - a live scrape against a real search
  # backend must never be a thing a PR's CI run does, non-blocking or not.
  # `continue-on-error: true` on top of that means even a schedule/dispatch
  # run can never fail the build - see scripts/check_web_search_canary.py,
  # which also always exits 0 on its own.
  web-search-canary:
    name: web search canary (warn-only, schedule/dispatch only)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '37 6 * * 1') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        run: |
          uv export --quiet --locked --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      - name: Run one real search per search service and report whether each layout still parses
        continue-on-error: true
        run: python scripts/check_web_search_canary.py

  # Speech-to-text against the voice stack a user actually gets. Every other job
  # installs `.[dev,rag]`, which has no PyAV or faster-whisper, so the voice
  # tests skip there; this job installs the voice extra with pip, which resolves
  # the NEWEST versions the extra allows, and runs the real decode tests on them.
  # A PyAV or faster-whisper release that breaks decoding shows up here within a
  # week at the latest (the weekly schedule), or on the next pull request. It is
  # deliberately not one of the jobs merge-policy requires: an upstream break
  # must be visible, but must not block an unrelated change.
  voice-stack:
    name: voice stack (real decode, newest allowed PyAV and faster-whisper)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '37 6 * * 1') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install the voice extra
        run: |
          uv export --quiet --locked --no-emit-project --extra dev --extra voice -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      - name: Show the resolved versions
        run: pip list 2>/dev/null | grep -i -E "^(av|faster-whisper|ctranslate2|numpy|tokenizers|onnxruntime) "

      # LOCALM_REQUIRE_VOICE_STACK=1 turns "the voice stack is missing" into a
      # test FAILURE instead of a skip, and the step then also fails if anything
      # at all was skipped: a skipped voice test checks nothing and reads green.
      - name: Real decode tests (nothing may be skipped)
        env:
          LOCALM_REQUIRE_VOICE_STACK: "1"
        run: |
          python -m pytest tests/test_voice_decode_audio.py tests/test_voice_decode_errors.py tests/test_voice_robustness.py tests/test_voice_stack_gating.py -m "not integration" -q -rs | tee voice-tests.log
          if grep -qE "[0-9]+ skipped" voice-tests.log; then
            echo "::error::a voice test was skipped; the voice stack must be fully exercised in this job"
            exit 1
          fi

      - name: Whisper smoke (weekly and manual runs only, downloads the tiny model)
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import numpy as np
          from faster_whisper import WhisperModel
          model = WhisperModel("tiny", device="cpu", compute_type="int8")
          segments, info = model.transcribe(np.zeros(16000, dtype=np.float32))
          list(segments)
          print("transcribed one second of silence, language:", info.language)
          PY

  # The tests that need an optional package (torch, transformers, psutil, ...)
  # call pytest.importorskip, so in every job above, which installs only
  # `.[dev,rag]`, they SKIP and read green while checking nothing. This job
  # installs those packages and runs exactly the test files that gate on them,
  # with LOCALM_REQUIRE_OPTIONAL naming the packages: a skip for a missing one
  # then FAILS (tests/_require_optional.py). Not required here, on purpose:
  # tkinter (needs a display), playwright and webview (a browser or a window),
  # and the private manifest checker. Same triggers as the test matrix: the
  # nightly and weekly schedules, a manual dispatch, or a pull request
  # labelled full-ci. Not part of merge-policy.
  optional-stacks:
    name: optional stacks (tests that need torch, transformers, ... must run, not skip)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    env:
      LOCALM_REQUIRE_OPTIONAL: torch,transformers,tokenizers,accelerate,psutil,PIL,pypdf,numpy,soundfile,av,packaging,xgrammar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # torch first, from the CPU index, so no later install pulls a CUDA build.
      - name: Install the optional stacks
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/torch-cpu.txt
          uv export --quiet --locked --no-emit-project --prune torch --extra dev --extra rag --extra hf --extra monitor --extra audio --extra voice --extra grammar -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .

      - name: Show the resolved versions
        run: pip list 2>/dev/null | grep -i -E "^(torch|transformers|tokenizers|accelerate|psutil|pillow|pypdf|numpy|soundfile|av|xgrammar|faster-whisper) "

      - name: Run every test file that gates on one of these packages
        run: |
          FILES=$(grep -rlE "importorskip\(.(torch|transformers|tokenizers|accelerate|psutil|PIL|pypdf|numpy|soundfile|av|packaging|xgrammar)" tests --include='*.py' | sort)
          echo "$FILES" | wc -l
          python -m pytest $FILES -m "not integration" -n 2 -rs -q --continue-on-collection-errors

  # The one check that sums up the others (docs/architecture.md, "Merge
  # policy"). Runs on every pull_request once the six jobs it needs have
  # finished, whatever their results, and never on push, dispatch or
  # schedule. scripts/merge_policy.py reads those results and the change:
  # lint, gui-tests and mutation-scope must have succeeded; without the
  # `full-ci` label python-pr-gate must have succeeded and the change must
  # not be a release (VERSION unchanged); with the label the test matrix
  # must have succeeded; mutation-test must not have failed when it ran
  # (skipped is neutral). A release PR without the label fails here with the
  # label named; every other PR merges without the matrix. A skipped
  # required job never passes.
  merge-policy:
    # Skipped runs keep the unevaluated expression as their check name, so only a
    # pull_request run reports a check called merge-policy. See
    # test_the_merge_policy_check_name_exists_only_on_pull_request_runs.
    name: ${{ github.event_name == 'pull_request' && 'merge-policy' || 'merge-policy (pull_request runs only)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-pr-gate, lint, gui-tests, test, mutation-scope, mutation-test]
    # Runs after a needed job failed or was skipped. See
    # test_the_merge_policy_job_cannot_be_skipped_green.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      # fetch-depth: 0 is required: the policy diffs the change from
      # `git merge-base origin/master HEAD`; a shallow checkout has no
      # origin/master at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Stdlib only: no venv, no install.
      - name: Merge policy
        env:
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          RESULT_PYTHON_PR_GATE: ${{ needs.python-pr-gate.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_GUI_TESTS: ${{ needs.gui-tests.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_MUTATION_SCOPE: ${{ needs.mutation-scope.result }}
          RESULT_MUTATION_TEST: ${{ needs.mutation-test.result }}
        run: >-
          python scripts/merge_policy.py --full-ci "$FULL_CI"
          --result "python-pr-gate=$RESULT_PYTHON_PR_GATE"
          --result "lint=$RESULT_LINT"
          --result "gui-tests=$RESULT_GUI_TESTS"
          --result "test=$RESULT_TEST"
          --result "mutation-scope=$RESULT_MUTATION_SCOPE"
          --result "mutation-test=$RESULT_MUTATION_TEST"
