name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + hygiene + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Light deps only. The [gpu]/[gguf] extras pull torch / ROCm / llama-cpp
      # wheels from a custom AMD index and are GPU-bound, so they are never
      # installed in CI; optional-dependency tests skip themselves (importorskip).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The mandated repo-hygiene gate (AGENTS.md): no em/en dashes, no personal
      # disclosure, no machine-absolute paths in code.
      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      - name: Tests
        run: pytest -m "not integration"

      # ruff is configured (pyproject [tool.ruff]) but not yet blocking while an
      # unused-import backlog remains. Flip continue-on-error to false once it is
      # cleared.
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .
