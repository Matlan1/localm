name: CI

on:
  # Push runs only on master (post-merge verification). Branch work is covered by
  # the pull_request trigger, so a PR gets ONE run, not two (push + PR) - half the
  # Actions spend. workflow_dispatch + the weekly schedule are unaffected.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check of the hand-written llama.cpp ctypes binding against the
    # MOVING upstream release the cpu/vulkan/cuda backends track. Mon 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    # INFRA-1: run on Linux as well as Windows. Both are declared supported
    # platforms (see the classifiers in pyproject.toml), so cross-platform
    # regressions (paths, line endings, signals, the SetConsoleCtrlHandler path,
    # process spawning) must be caught here, not by a user on the other OS.
    name: lint + hygiene + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other OS on the first failure: a Linux-only break is
      # exactly the signal this matrix exists to surface, so let Windows finish.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # fetch-depth: 0 (full history) is REQUIRED, not a nicety: the hygiene gates that
      # diff against the published record - the changelog append-only check and the PWA
      # cache-bump check - resolve their baseline via `git merge-base HEAD origin/master`.
      # actions/checkout defaults to fetch-depth 1, which creates no origin/* ref at all,
      # so merge-base fails, the baseline silently falls back to HEAD, and a clean CI
      # checkout diffs against ITSELF: both gates then pass unconditionally, for every
      # file, on every PR. Measured on real repos: shallow -> a shell asset changed with
      # no CACHE bump exits 0 (silent pass); full -> the same commit correctly fails.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # DEP-1: the committed uv.lock must stay consistent with pyproject.toml so a
      # dependency change without a matching `uv lock` cannot silently rot the lock
      # into a stale claim. `uv lock --check` fails on drift. (The Install step
      # below still uses pip; the lock is the pinned set for `uv sync --locked`.)
      - name: Install uv (for the lockfile check)
        uses: astral-sh/setup-uv@v7
      - name: Verify uv.lock matches pyproject (DEP-1, no silent drift)
        run: uv lock --check

      # localm is meant to run from its PROJECT VENV: a venv guard (NEW-J) refuses
      # a bare global interpreter so a stray global install fails loudly instead of
      # with a cryptic missing-runtime-dep error. Create a venv and prepend it to
      # PATH so every step below - pip, pytest, ruff, hygiene, AND the
      # `python -m localm` SUBPROCESSES the job-streaming tests spawn - runs from
      # it, matching real usage. Per-OS steps use each runner's NATIVE shell +
      # $GITHUB_WORKSPACE (a native path on both); a single Git-Bash step would put
      # an MSYS path like /d/a/... on PATH that the Windows steps cannot resolve.
      - name: Create the project venv
        run: python -m venv .venv
      - name: Put the venv on PATH (POSIX)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Put the venv on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.venv\Scripts"

      # Light extras only ([rag] = pypdf, pure-Python). The [gpu]/[gguf] extras
      # pull torch / ROCm / llama-cpp wheels from a custom AMD index and are
      # GPU-bound, so they are never installed in CI; tests needing those extras
      # skip themselves (importorskip).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      # The mandated repo-hygiene gate (AGENTS.md): no em/en dashes, no personal
      # disclosure, no machine-absolute paths in code. It also runs the release-file
      # manifest gate (scripts/check_manifest.py, folded into check_hygiene): every
      # tracked file must be classified release-include/-exclude in release-manifest.toml,
      # nothing local-only may be committed, and no pattern may go stale.
      - name: Hygiene gate
        run: python scripts/check_hygiene.py

      # TEST-1: publish coverage for visibility. There is no --cov-fail-under gate
      # yet (a low number must not fail the build); the goal this pass is a number
      # in the log plus an uploaded coverage.xml. Config is in pyproject
      # [tool.coverage]. The [gpu]/[gguf] extras are not installed, so tests that
      # need them importorskip and are simply not counted.
      # -n auto (pytest-xdist) distributes across worker processes; every test
      # already gets its own LOCALM_HOME via the autouse tmp_path fixture in
      # tests/conftest.py and the few tests that bind a real socket use an
      # OS-assigned ephemeral port, so this is safe. See AGENTS.md "Test-run
      # cadence".
      - name: Tests
        run: pytest -m "not integration" -n auto --cov=localm --cov-report=term-missing --cov-report=xml

      # GUI is vanilla JS (localm/plugins/gui/static); the jsdom harness under
      # tests-js/ loads app.js and exercises it. node:test, no build step.
      - name: Setup Node (GUI JS tests)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: GUI tests (jsdom)
        run: |
          npm ci
          npm test

      # ruff is configured (pyproject [tool.ruff]) and blocking: the unused-import
      # backlog (F401/F841/E401/F541) was cleared, so a new lint regression fails CI.
      - name: Lint (ruff)
        run: ruff check .

  # Validate the hand-written ctypes binding against the ACTUAL upstream binary.
  # Heavy (downloads the cpu prebuilt) and checks a MOVING upstream target, so it
  # runs weekly + on manual dispatch only, not on every push. Per-push coverage of
  # the binding lives in the offline unit tests (test_llamacpp_abi.py,
  # test_check_llama_abi.py) on the job above.
  abi-check:
    name: native llama.cpp ABI drift
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      # Header-level drift: diff our struct offsets against the latest upstream
      # llama.h. A mid-struct reorder/insert exits non-zero here.
      - name: Header ABI diff vs latest upstream release
        shell: bash
        run: python scripts/check_llama_abi.py --ref latest

      # Binary-level drift: provision the real cpu prebuilt (GPU-free, loads on a
      # plain runner). setup-llama load-tests it, which runs verify_abi; the
      # explicit report below fails the job on a proven mismatch.
      - name: Provision cpu prebuilt and verify ABI against the real binary
        shell: bash
        run: |
          python -m localm setup-llama --backend cpu --yes
          python - <<'PY'
          import sys
          from localm.inference.backends.llamacpp._abi import abi_report
          v = abi_report()
          print("ABI status:", v.status, "| detail:", v.detail)
          for f in v.failures:
              print("  -", f)
          sys.exit(1 if v.status == "mismatch" else 0)
          PY
