[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localm"
version = "0.1.5rc3"
description = "Local AI platform - offline LLM inference, model management, and extensible agent plugins"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Matlan1" }]
keywords = ["llm", "gguf", "llama", "local", "offline", "inference", "agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
# The 3.12 series is the one supported interpreter: the installers (setup.sh/
# setup.bat) build a `uv venv --python 3.12`, the AMD ROCm wheels are cp312-only,
# CI runs 3.12, and the core plugin loader imports tomllib (3.11+) unguarded. The
# old ">=3.10" was never true (3.10 cannot even import localm.plugins.loader) and
# was never exercised because CI only ever ran 3.12. Bounded ABOVE too (<3.13):
# the cp312-only AMD wheels make any other 3.x unsatisfiable, and claiming an
# untested 3.13+ would just recreate the same drift. Bump deliberately if the
# installer ever provisions a newer Python.
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.4.1",
    "rich>=15.0.0",
    "requests>=2.31",
    # setup-llama verifies its GitHub downloads against certifi's CA bundle, not
    # the OS cert store (which Python's TLS does not keep current on Windows, so a
    # fresh box fails the runtime download with CERTIFICATE_VERIFY_FAILED). It is
    # already pulled in transitively by requests, but setup_llama imports it
    # directly, so it is declared directly: never rely on a transitive package
    # staying present. See localm/setup_llama.py _ssl_context.
    "certifi>=2026.7.22",
    # The coder's `grep` and `search_replace` tools compile a regex the MODEL
    # supplies, so the pattern is attacker-influenced and a nested quantifier
    # costs time that doubles per input character. stdlib `re` cannot be
    # interrupted once inside a match at any price; `regex` takes a `timeout=`
    # and is the only thing that can stop a runaway one. Core, not an extra: the
    # coder ships enabled and this is a DoS bound, so it must never be opt-in.
    #
    # Declared directly even though it already arrives transitively (via
    # transformers, which is OPTIONAL) - exactly the certifi lesson above. A base
    # install has no transformers, so relying on the transitive path would leave
    # this guard absent precisely where nobody would think to look for it. See
    # localm/plugins/coder/tools/files.py _compile_model_pattern.
    "regex>=2026.7.19",
    "huggingface-hub>=1.28.0",
    "pydantic>=2.13.4",
    "fastapi>=0.141.1",
    # fastapi's own requirement is only starlette>=0.46.0, too weak to rely on:
    # installs are lock-unaware (setup.sh/setup.bat run `uv pip install -e`,
    # never `uv sync`), so a fresh install resolves this floor directly rather
    # than uv.lock's pinned 1.3.1. Declared explicitly so the ASGI layer
    # fastapi depends on cannot resolve to something far older than what this
    # project is actually tested against.
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    # Built-in TLS (NET-1): localm mints a local CA + leaf cert so a network
    # bind serves HTTPS out of the box. Core, not an extra - encryption on an
    # exposed bind must never be opt-in. See localm/tls.py and docs/tls.md.
    "cryptography>=50.0.0",
    # QR codes: the companion pairing flow renders a key QR server-side and the
    # GUI/CLI print LAN-URL QRs. Core so phone pairing works out of the box.
    "qrcode>=8.2",
    "zeroconf>=0.150.0",
    # Windows VRAM reporting: gpu_usage.py's PDH source reads the vendor-neutral
    # WDDM counter Task Manager itself uses, via win32pdh from pywin32. It is the
    # ONLY device-global VRAM source on a non-AMD Windows GPU - the preferred
    # source, AMD's ADL, is AMD-only by construction - so without it every
    # NVIDIA/Intel Windows install loses the cross-process correction entirely.
    #
    # It was previously undeclared while installed in the maintainer's venv, and
    # gpu_usage.py's own module docstring called it "already a dependency", which
    # was simply not true of any clean install. The gap was invisible precisely
    # where it was written: on an AMD box ADL answers first and PDH is never
    # reached, so nothing local degrades (AGENTS.md: design for every setup, not
    # this one). Windows-gated because PDH is a Windows API and the module never
    # reaches for it elsewhere.
    #
    # Its ABSENCE is honest rather than dangerous - device_global_used_bytes()
    # returns {} ("unmeasurable"), never a fabricated figure, verified by
    # blocking the import - so this is declared to restore a capability, not to
    # fix a lie. See tests/test_gpu_usage_pdh_absent.py.
    "pywin32>=311; sys_platform == 'win32'",
    # NOTE: the MCP Python SDK ("mcp") is deliberately NOT a dependency. localm
    # speaks the MCP stdio transport directly - see localm/plugins/mcpserver/server.py
    # (server side) and localm/plugins/coder/mcp.py (client side). The SDK was a
    # dependency until #585 rewrote the server off it; the requirement outlived the
    # import by mistake and pulled in 13 packages nothing here uses, python-multipart
    # among them, which the GUI upload/share paths go out of their way to avoid.
    # Image decoding for vision models. CORE, not an extra: the GGUF vision
    # path needs it and needs no torch, while pillow used to ship only with the
    # gpu extra - so a GGUF-only install crashed on any attached image.
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# AI coding agent - offline agentic loop, tool use, project map
# Install with:  pip install "localm[coder]"
# Invoke via:    localm coder --model <name>  OR  localcoder --model <name>
coder = [
    # requests is already a core dep; listed here for explicit plugin opt-in
    "requests>=2.31",
]

# Standalone app window instead of a browser tab (ADR-0011) - `localm gui`
# opens in a native OS webview window when this extra is installed, falling
# back to the browser tab otherwise (localm/appface.py run_native_window -
# never a hard requirement, always a best-effort upgrade). Optional, not
# core: on Windows it pulls in pythonnet (a real, non-trivial transitive
# dep - it hosts WebView2 via .NET/WinForms, not a bare ctypes binding).
#
# Linux gets a DIFFERENT backend than Windows/macOS on purpose: pywebview's
# default Linux backend (GTK, via the `gi` GObject-Introspection bindings)
# does a plain `import gi` with no venv fallback (verified against pywebview's
# own webview/platforms/gtk.py source) - it can ONLY see a SYSTEM-installed
# python3-gi, and this project's venvs are never created with
# --system-site-packages (setup.sh's `uv venv` call), so an apt-installed
# python3-gi would be invisible to it regardless. The `[qt]` extra
# (qtpy + PyQt6 + PyQt6-WebEngine) sidesteps this: verified live in a real,
# fully isolated venv on Linux (WSL2/Ubuntu, zero apt packages, zero sudo) -
# pip install alone gets a working pywebview window all the way through
# webview.start(gui="qt"). The one residual gap, also verified live: the
# underlying Qt/XCB windowing layer can still want a couple of small base
# system libraries (e.g. libxcb-cursor0) that are not part of any Python
# package - commonly already present on a real desktop install (virtually
# every desktop environment already depends on some X11/XCB client library
# stack) but not on a minimal/headless box, which is exactly why
# run_native_window's browser-tab fallback stays load-bearing on Linux, not
# a formality. See appface.py's Linux gui="qt" forcing for the other half.
# Install with:  uv pip install -e ".[desktop]"
desktop = [
    "pywebview>=6.2.1; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
]

# AMD RDNA2 (RX 6xxx) GPU stack - ROCm 7.13.0, Python 3.12, Windows
# Install with:  uv pip install -e ".[gpu]"  (requires Python 3.12 venv)
gpu = [
    # Cap BELOW 5.16: transformers 5.14/5.14.1 imported transformers/distributed/fsdp.py
    # during `from transformers import AutoTokenizer` (via generation -> GenerationMixin),
    # which needs torch's distributed C extension (torch._C._distributed_c10d). The ROCm
    # Windows torch pinned below is built WITHOUT distributed, so 5.14.1 made EVERY HF
    # model load die at "loading processor..." with a lazy-import message that hid the
    # real cause ("Could not import module 'AutoTokenizer'"). Re-verified 2026-08-18
    # against 5.15.0, sideloaded fresh (not the dev venv) onto the pinned ROCm torch
    # (2.9.1+rocm7.13.0): AutoTokenizer/AutoModelForCausalLM import clean, and a real
    # load + generate() on sshleifer/tiny-gpt2 completes end to end (this is the same
    # generation -> GenerationMixin path the fsdp import bug used to break). The full
    # hf-backend test suite, including the integration tests that download and run that
    # model for real, passed unchanged against the sideloaded version. NOT re-verified:
    # actual GPU device placement/compute, and the multimodal AutoProcessor path.
    # A plain ~=5.13 or ~=5.15 does NOT cap this: it resolves to the newest 5.x. Lift the
    # cap further only once transformers 5.16+ is re-verified the same way (or the win32
    # torch wheel ships distributed) - re-verify with a cold install, not the dev venv,
    # since the dev venv lags uv.lock and hid the original regression.
    "transformers[kernels]~=5.15.1",
    # Pin the transitive tokenizers so it does not flip between resolver passes
    # (the 0.23.1 <-> 0.22.2 churn on repeated setup runs). 0.22.2 is what
    # transformers 5.12 (tokenizers<=0.23.0,>=0.22.0) resolves to.
    "tokenizers==0.22.2",
    "accelerate>=1.14.0",
    # hf.py's _cpu_budget() imports psutil directly to build the "cpu" entry of
    # max_memory (REG-528: without that entry the overflow maps to "disk", which
    # needs an offload_folder and errors without one). accelerate happens to depend
    # on psutil today, so this path has been working on a transitive dep by luck;
    # declare what we actually import so an accelerate change cannot break it.
    "psutil>=7.2.2",
    "torch==2.11.0+rocm7.13.0; sys_platform == 'win32'",
    "torchvision==0.26.0+rocm7.13.0; sys_platform == 'win32'",
    "rocm; sys_platform == 'win32'",
    "rocm-sdk-core; sys_platform == 'win32'",
    "rocm-sdk-libraries-gfx103x-all; sys_platform == 'win32'",
]
# Audio multimodal (Gemma4 unified audio)
audio = [
    "soundfile>=0.14.0",
]
# Knowledge collections (chat with your documents) - only PDF parsing needs
# a package; txt/md/docx/html/code extraction is stdlib.
# Install with:  pip install "localm[rag]"
rag = [
    "pypdf>=6.16.1",
]
# Speech-to-text for the GUI mic button (Whisper, CPU int8 - no torch).
# Install with:  pip install "localm[voice]"
voice = [
    "faster-whisper>=1.2.1",
]
# Live hardware monitor in the GUI status bar (CPU % + RAM). VRAM and NVIDIA
# GPU % need no package. Optional: the monitor just omits CPU/RAM without it.
# The installers include this so the readout works out of the box.
# Install with:  pip install "localm[monitor]"
monitor = [
    "psutil>=7.2.2",
]
# Grammar-constrained decoding (GBNF/EBNF) for the HuggingFace backend. The GGUF
# backend already has this natively via llama.cpp's grammar sampler; this extra
# brings the same capability to transformers models through xgrammar. Optional:
# chat works without it, and the HF backend falls back to unconstrained output
# if a grammar is requested while this is not installed. Layers on top of [gpu].
# xgrammar masks logits with a Triton kernel. Upstream Triton ships no Windows
# wheels, so on Windows we pull the triton-windows port - verified working with
# the pinned AMD ROCm torch on win32 (real GBNF-constrained decoding on gfx1030).
# On Linux, xgrammar's normal triton dependency applies. If Triton is somehow
# absent the HF backend soft-degrades to unconstrained instead of hanging.
# Install with:  pip install "localm[gpu,grammar]"
grammar = [
    "xgrammar>=0.2.2",
    "triton-windows>=3.7; sys_platform == 'win32'",
]
# CPU-only install - the base package already runs GGUF models on CPU via the
# ctypes binding (only llama.dll + ggml*.dll needed). This extra exists so
# `pip install "localm[cpu]"` is an explicit, documented choice.
cpu = []
# Development + CI tooling (lint + tests). Install with:  pip install -e ".[dev]"
dev = [
    "ruff>=0.16.4",
    "pytest>=8.0",
    # Coverage measurement (TEST-1). Visibility only for now: CI publishes a
    # number, there is no --cov-fail-under gate. See [tool.coverage] below.
    "pytest-cov>=5.0",
    # Parallel test execution (TEST-2): the suite is single-process by default
    # (~4200 tests, ~7-8 min sequential). Every test already gets its own
    # LOCALM_HOME via the autouse tmp_path fixture in tests/conftest.py, and the
    # handful of tests that bind a real socket use an OS-assigned ephemeral port
    # (0), so distributing across worker processes is safe. Run with `-n auto`;
    # not forced on by default via addopts so a plain `pytest` still works
    # everywhere (e.g. under a debugger, or -k a single test) without surprise
    # worker overhead.
    "pytest-xdist>=3.6",
    # Feature parsers whose extraction code has tests that otherwise SILENTLY SKIP
    # when the optional extra is absent (the default install is .[coder,voice,
    # monitor], no rag). pypdf gates tests/test_rag.py's real PDF round-trip; keep
    # it here so the PDF path (incl. its hardening) is actually exercised in dev/CI.
    "pypdf>=6.16.1",
    # Same rationale as pypdf, one step worse: these tests FAIL rather than skip
    # without it. tests/test_hf_device_map.py drives hf.py's _cpu_budget() and
    # tests/test_spawn_worker_dies_with_parent.py imports psutil at module scope, but
    # CI installs .[dev,rag] (no gpu, no monitor), so psutil is absent there even
    # though every real install path ships it (both installers use .[coder,voice,
    # monitor], and the gpu extra pulls accelerate). Keep it here so CI exercises the
    # device-map and worker-reaping paths instead of erroring on the import.
    "psutil>=7.2.2",
]

[project.scripts]
# console_main wraps the CLI group with the venv guard (NEW-J); the bare `main`
# stays importable for in-process callers (tests, the `localm coder` route).
localm    = "localm.cli:console_main"
# backward-compat alias - installed only when the [coder] extra is present.
# pip/uv honours this because the package is installed; the command always
# works as long as localm[coder] was requested.
localcoder = "localm.plugins.coder.cli:console_main"

[project.urls]
Homepage = "https://github.com/Matlan1/localm"
Repository = "https://github.com/Matlan1/localm"
Issues = "https://github.com/Matlan1/localm/issues"
Changelog = "https://github.com/Matlan1/localm/blob/master/CHANGELOG.md"

[tool.uv]
exclude-newer-package = { rocm = false, rocm-sdk-core = false, rocm-sdk-libraries-gfx103x-all = false, torch = false, torchvision = false, transformers = false }
# ctranslate2's win32/darwin wheel metadata resolves an older setuptools than its
# Linux wheel does (CVE-2026-59890, sdist MANIFEST.in exclusion bypass, fixed in
# 83.0.0) even though ctranslate2 itself declares no upper bound - force the floor
# on every platform rather than only where the wheel metadata already allows it.
override-dependencies = ["setuptools>=83.0.0"]

[[tool.uv.index]]
name = "rocm-gfx1030"
url = "https://repo.amd.com/rocm/whl/gfx103X-all/"
explicit = true

[tool.uv.sources]
torch = [
  { url = "https://repo.amd.com/rocm/whl/gfx103X-all/torch-2.11.0%2Brocm7.13.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
]
torchvision = [
  { url = "https://repo.amd.com/rocm/whl/gfx103X-all/torchvision-0.26.0%2Brocm7.13.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
]
rocm = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]
rocm-sdk-core = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]
rocm-sdk-libraries-gfx103x-all = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external tools (git, network) to be present",
    "allow_large_tmp_files: this test genuinely needs >100MB of REAL bytes in tmp_path. Rare: prefer faking the size (b._model_bytes = lambda: n), since truncate() is not sparse on NTFS and writes those bytes for real on every run. Add a why-comment when using it.",
    "real_gguf: real end-to-end GGUF inference; needs the native llama runtime (localm setup-llama). Skipped unless available.",
    "real_comfy: real ComfyUI round-trip; set LOCALM_TEST_COMFY_URL to a running instance. Skipped unless set.",
    "real_browser: drives the GUI in a real browser; needs Playwright (pip install playwright && playwright install). Skipped unless available.",
    "real_vulkan_split: real multi-device split/load/inference across the native ggml-vulkan backend (a real GPU plus a second real Vulkan device, e.g. Mesa lavapipe - see dev-notes/split-gpu-testing-research-2026-07-13.md). Set LOCALM_TEST_LAVAPIPE_ICD to the second device's Vulkan ICD manifest path. Skipped unless set.",
    "real_multi_gpu_hardware: Tier 2 real-hardware GPU-split gate - real VRAM pressure/allocator/OOM behavior and the amd-rocm/HIP split path, on any real 2-GPU box, owned or rented (see scripts/tier2_gpu_split/README.md). Set LOCALM_TEST_REAL_MULTI_GPU=1. Skipped unless set.",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Declare the rule set EXPLICITLY rather than inheriting ruff's default, because
# that default is a MOVING target and CI installs the newest ruff (the dev extra
# is a floor, `ruff>=...`, and the Install step uses pip, not `uv sync --locked`,
# so the lockfile pin does not govern what CI runs). Measured: ruff 0.15.21 -> 0
# errors, ruff 0.16.0 -> 3657 errors on the SAME commit, none of them E or F. The
# 0.16 release widened the default selection to include I, UP, BLE, S, SIM, RUF,
# PL, B, TRY and more, so master's lint step went red with no code change and no
# actual regression. Pinning ruff would only defer that to the next bump; naming
# the rules is what makes the gate mean the same thing across versions.
#
# E4 + E7 + E9 + F is exactly what ruff enabled here before 0.16, so this freezes
# today's policy rather than quietly changing it: 55 rules, verified identical
# under both 0.15.21 and 0.16.0 (`ruff check . --show-settings`).
#
# Adopting any of the newly-default families is a deliberate style decision with
# a real backlog behind it (UP045 x1021, BLE001 x822, I001 x478), so it belongs
# in its own change, not in a linter upgrade.
select = ["E4", "E7", "E9", "F"]

# The codebase deliberately uses a compact style: one-line guards (if x: return),
# short local names, and a few intentional late module-level imports. Ignore those
# stylistic rules; keep the pyflakes (F) checks that catch real dead code plus the
# rest of ruff's default E set. The unused-import/variable backlog has been
# cleared and CI's ruff step is now blocking (.github/workflows/ci.yml).
ignore = ["E741", "E701", "E702", "E402"]

# Coverage measurement (TEST-1). CI prints a number and uploads coverage.xml/
# coverage.json. Run locally with:
#   pytest -m "not integration" --cov=localm --cov-report=term-missing
[tool.coverage.run]
source = ["localm"]
# Branch coverage matters here: the debt this measures is concentrated in a few
# very large, heavily-branched functions (e.g. create_app), so line coverage
# alone would overstate how exercised they are.
branch = true
omit = [
    # Module entry shims that only run when the package is executed, not imported
    # by the unit suite; counting them just depresses the number with dead noise.
    "localm/__main__.py",
    "localm/*/__main__.py",
]

[tool.coverage.report]
show_missing = true
# Keep coverage's default "pragma: no cover" and ADD these intentionally
# unreachable-in-tests lines so they do not count against the number.
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Coverage RATCHET (added after the "there is intentionally no gate yet" era
# above). Measured on merged master (d62b244b, 2026-07-29) with
# `pytest -m "not integration" -n auto --cov=localm`: TOTAL was 79% (branch
# coverage, 40167 statements, 13022 branches). This floor is 78 - deliberately
# ONE POINT BELOW that measurement, not at it and not above it. A gate that
# fails spuriously on ordering noise or a couple of skipped/platform-gated
# tests gets disabled by the first person it inconveniences, and then
# protects nothing; a point of headroom keeps it meaningful. It exists to
# catch a REGRESSION, not to express an aspiration - raise it deliberately
# (in the same PR as the work that earns the higher number), never lower it
# without saying why.
#
# pytest-cov reads `fail_under` from this coverage config automatically (see
# pytest_cov/plugin.py: `cov_config.fail_under` is used whenever
# --cov-fail-under is not passed on the command line), so the existing CI
# "Tests" step (.github/workflows/ci.yml) enforces this without any extra
# wiring. Per-module floors for the trust-boundary modules (pathsafe, auth,
# netpolicy, scopes, tls, bindhost, config, portmux) are NOT expressible here
# - coverage.py has no per-file fail_under - so they live in
# scripts/check_coverage_floors.py instead; see that file for what it checks
# and why it is a separate script rather than a plugin.
#
# WHAT THIS IS AND IS NOT. This is DRIFT PROTECTION, not defect prevention.
# Measured the same day this floor was added: all nine real defects found in
# this repo that week lived in code sitting at 85-96% coverage. Not one was an
# uncovered line - the lines executed and the tests asserted the wrong thing,
# or nothing at all. Coverage measures execution, not verification. Do not
# read a green run of this gate as "regressions are unlikely" - it only means
# the EXECUTED fraction of the code did not shrink; whether what runs is
# actually checked is a question this number cannot answer.
fail_under = 78
