[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localm"
version = "0.1.0"
description = "Local AI platform - offline LLM inference, model management, and extensible agent plugins"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Matlan1" }]
keywords = ["llm", "gguf", "llama", "local", "offline", "inference", "agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "rich>=15.0.0",
    "requests>=2.31",
    "huggingface-hub>=1.19.0",
    "pydantic>=2.13.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # Built-in TLS (NET-1): localm mints a local CA + leaf cert so a network
    # bind serves HTTPS out of the box. Core, not an extra - encryption on an
    # exposed bind must never be opt-in. See localm/tls.py and docs/tls.md.
    "cryptography>=42",
    # QR codes: the companion pairing flow renders a key QR server-side and the
    # GUI/CLI print LAN-URL QRs. Core so phone pairing works out of the box.
    "qrcode>=8.2",
    "zeroconf>=0.150.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# AI coding agent - offline agentic loop, tool use, project map
# Install with:  pip install "localm[coder]"
# Invoke via:    localm coder --model <name>  OR  localcoder --model <name>
coder = [
    # requests is already a core dep; listed here for explicit plugin opt-in
    "requests>=2.31",
]

# AMD RDNA2 (RX 6xxx) GPU stack - ROCm 7.13.0, Python 3.12, Windows
# Install with:  uv pip install -e ".[gpu]"  (requires Python 3.12 venv)
gpu = [
    "transformers[kernels]~=5.12",
    # Pin the transitive tokenizers so it does not flip between resolver passes
    # (the 0.23.1 <-> 0.22.2 churn on repeated setup runs). 0.22.2 is what
    # transformers 5.12 (tokenizers<=0.23.0,>=0.22.0) resolves to.
    "tokenizers==0.22.2",
    "accelerate>=1.0",
    "pillow>=10.0",
    "torch==2.9.1+rocm7.13.0; sys_platform == 'win32'",
    "torchvision==0.24.0+rocm7.13.0; sys_platform == 'win32'",
    "rocm; sys_platform == 'win32'",
    "rocm-sdk-core; sys_platform == 'win32'",
    "rocm-sdk-libraries-gfx103x-all; sys_platform == 'win32'",
]
# In-process GGUF inference - AMD GPU build:
#   pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/rocm602
gguf = [
    "llama-cpp-python>=0.3.31",
]
# Audio multimodal (Gemma4 unified audio)
audio = [
    "soundfile>=0.14.0",
]
# Knowledge collections (chat with your documents) - only PDF parsing needs
# a package; txt/md/docx/html/code extraction is stdlib.
# Install with:  pip install "localm[rag]"
rag = [
    "pypdf>=6.13.2",
]
# Speech-to-text for the GUI mic button (Whisper, CPU int8 - no torch).
# Install with:  pip install "localm[voice]"
voice = [
    "faster-whisper>=1.0",
]
# Live hardware monitor in the GUI status bar (CPU % + RAM). VRAM and NVIDIA
# GPU % need no package. Optional: the monitor just omits CPU/RAM without it.
# The installers include this so the readout works out of the box.
# Install with:  pip install "localm[monitor]"
monitor = [
    "psutil>=5.9",
]
# Grammar-constrained decoding (GBNF/EBNF) for the HuggingFace backend. The GGUF
# backend already has this natively via llama.cpp's grammar sampler; this extra
# brings the same capability to transformers models through xgrammar. Optional:
# chat works without it, and the HF backend falls back to unconstrained output
# if a grammar is requested while this is not installed. Layers on top of [gpu].
# xgrammar masks logits with a Triton kernel. Upstream Triton ships no Windows
# wheels, so on Windows we pull the triton-windows port - verified working with
# the pinned AMD ROCm torch on win32 (real GBNF-constrained decoding on gfx1030).
# On Linux, xgrammar's normal triton dependency applies. If Triton is somehow
# absent the HF backend soft-degrades to unconstrained instead of hanging.
# Install with:  pip install "localm[gpu,grammar]"
grammar = [
    "xgrammar>=0.2.2",
    "triton-windows>=3.7; sys_platform == 'win32'",
]
# CPU-only install - the base package already runs GGUF models on CPU via the
# ctypes binding (only llama.dll + ggml*.dll needed). This extra exists so
# `pip install "localm[cpu]"` is an explicit, documented choice.
cpu = []
# [PoC] Show a scannable QR of the LAN URL at GUI startup (`localm gui --qr`),
# so a phone on the same network opens localm without typing an IP. Experimental
# proof-of-concept; pure-Python, no Pillow needed for the terminal QR.
# Install with:  pip install "localm[qr]"
qr = [
    "qrcode>=8.2",
]
# Abliterate models with Heretic. No new dependencies - the plugin only shells
# out to Heretic (a separate AGPL program; not bundled) and uses git + uv, which
# the user already has. This extra exists as an explicit opt-in marker.
abliterate = []
# Development + CI tooling (lint + tests). Install with:  pip install -e ".[dev]"
dev = [
    "ruff>=0.15.17",
    "pytest>=8.0",
]

[project.scripts]
localm    = "localm.cli:main"
# backward-compat alias - installed only when the [coder] extra is present.
# pip/uv honours this because the package is installed; the command always
# works as long as localm[coder] was requested.
localcoder = "localm.plugins.coder.cli:main"
localabliterate = "localm.plugins.abliterate.cli:main"

[tool.uv]
exclude-newer-package = { rocm = false, rocm-sdk-core = false, rocm-sdk-libraries-gfx103x-all = false, torch = false, torchvision = false, transformers = false }

[[tool.uv.index]]
name = "rocm-gfx1030"
url = "https://repo.amd.com/rocm/whl/gfx103X-all/"
explicit = true

[tool.uv.sources]
torch = [
  { url = "https://repo.amd.com/rocm/whl/gfx103X-all/torch-2.9.1%2Brocm7.13.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
]
torchvision = [
  { url = "https://repo.amd.com/rocm/whl/gfx103X-all/torchvision-0.24.0%2Brocm7.13.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
]
rocm = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]
rocm-sdk-core = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]
rocm-sdk-libraries-gfx103x-all = [
  { index = "rocm-gfx1030", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external tools (git, network) to be present",
    "real_gguf: real end-to-end GGUF inference; needs the native llama runtime (localm setup-llama). Skipped unless available.",
    "real_comfy: real ComfyUI round-trip; set LOCALM_TEST_COMFY_URL to a running instance. Skipped unless set.",
    "real_browser: drives the GUI in a real browser; needs Playwright (pip install playwright && playwright install). Skipped unless available.",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The codebase deliberately uses a compact style: one-line guards (if x: return),
# short local names, and a few intentional late module-level imports. Ignore those
# stylistic rules; keep the pyflakes (F) checks that catch real dead code plus the
# rest of ruff's default E set. The unused-import/variable backlog has been
# cleared and CI's ruff step is now blocking (.github/workflows/ci.yml).
ignore = ["E741", "E701", "E702", "E402"]
