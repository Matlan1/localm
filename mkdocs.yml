site_name: LocaLM
site_description: Run large language models on your own machine. Offline, private, and yours.
site_url: https://matlan1.github.io/localm/
repo_url: https://github.com/Matlan1/localm
repo_name: Matlan1/localm
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

exclude_docs: |
  pypi-readme.md
  layering.toml

hooks:
  - scripts/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Linux and macOS: linux-setup.md
      - Docker: docker.md
      - GPU setup: gpu-setup.md
      - The web GUI: gui.md
      - Using localm from your phone: phone.md
      - Reaching localm by name: naming.md
      - Native app identity: native-app.md
  - Using localm:
      - CLI reference: cli.md
      - Knowledge and RAG: rag.md
      - Durable memory: memory.md
      - Scheduled jobs: jobs.md
      - Agent skills: skills.md
      - Internet access: network.md
      - Privacy modes and diagnostics: privacy.md
  - Media generation:
      - FLUX image generation: flux-setup.md
      - Video generation: video.md
      - Managed ComfyUI: managed-comfyui.md
  - Server and integrations:
      - HTTP Server API: server-api.md
      - API reference: api-reference.md
      - MCP support: mcp.md
      - TLS and reverse proxies: tls.md
  - Extending:
      - Plugins: plugins.md
      - Plugin interop: plugin-interop.md
  - Internals:
      - Architecture: architecture.md
      - llama.cpp binding: llamacpp-binding.md
      - GUI design standard: gui-design.md
